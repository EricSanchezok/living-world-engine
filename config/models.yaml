schema_version: 3

scheduler:
  global_concurrency: 16
  max_queued_requests: 1024
  queue_timeout_ms: 300000

registry:
  refresh_interval_ms: 3600000
  request_timeout_ms: 10000
  stale_after_ms: 86400000

# Transport destinations and credential names are trusted local configuration.
# Metadata received from models.dev never changes these values.
accounts:
  deepseek-api:
    channel: api
    region: global
    protocol: openai-chat
    dialect: deepseek
    models_dev_provider_id: deepseek
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    max_concurrency: 4
    network:
      dns_over_https_url: https://1.1.1.1/dns-query
      socket_connect_attempts: 2
  openai-api:
    channel: api
    region: global
    protocol: openai-responses
    dialect: openai
    models_dev_provider_id: openai
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    max_concurrency: 16
  xai-api:
    channel: api
    region: global
    protocol: openai-responses
    dialect: xai
    models_dev_provider_id: xai
    base_url: https://api.x.ai/v1
    api_key_env: XAI_API_KEY
    max_concurrency: 16
  zhipu-api:
    channel: api
    region: cn
    protocol: openai-chat
    dialect: zhipu
    models_dev_provider_id: zhipuai
    base_url: https://open.bigmodel.cn/api/paas/v4
    api_key_env: ZHIPU_API_KEY
    max_concurrency: 16
  zhipu-coding-plan:
    channel: coding-plan
    region: cn
    protocol: openai-chat
    dialect: zhipu
    models_dev_provider_id: zhipuai-coding-plan
    base_url: https://open.bigmodel.cn/api/coding/paas/v4
    api_key_env: ZHIPU_CODING_PLAN_API_KEY
    max_concurrency: 16
  minimax-api-cn:
    channel: api
    region: cn
    protocol: anthropic-messages
    dialect: minimax
    models_dev_provider_id: minimax-cn
    base_url: https://api.minimaxi.com/anthropic/v1
    api_key_env: MINIMAX_API_KEY
    max_concurrency: 16
  minimax-token-plan-cn:
    channel: token-plan
    region: cn
    protocol: anthropic-messages
    dialect: minimax
    models_dev_provider_id: minimax-cn-coding-plan
    base_url: https://api.minimaxi.com/anthropic/v1
    api_key_env: MINIMAX_TOKEN_PLAN_API_KEY
    max_concurrency: 16
  kimi-api-cn:
    channel: api
    region: cn
    protocol: openai-chat
    dialect: moonshot
    models_dev_provider_id: moonshotai-cn
    base_url: https://api.moonshot.cn/v1
    api_key_env: MOONSHOT_API_KEY
    max_concurrency: 16
  kimi-coding-plan:
    channel: coding-plan
    region: cn
    protocol: anthropic-messages
    dialect: kimi
    models_dev_provider_id: kimi-for-coding
    base_url: https://api.kimi.com/coding/v1
    api_key_env: KIMI_CODING_PLAN_API_KEY
    max_concurrency: 16
  mimo-api-cn:
    channel: api
    region: cn
    protocol: openai-chat
    dialect: mimo
    models_dev_provider_id: xiaomi
    base_url: https://api.xiaomimimo.com/v1
    api_key_env: MIMO_API_KEY
    max_concurrency: 16
  mimo-token-plan-cn:
    channel: token-plan
    region: cn
    protocol: openai-chat
    dialect: mimo
    models_dev_provider_id: xiaomi-token-plan-cn
    base_url: https://token-plan-cn.xiaomimimo.com/v1
    api_key_env: MIMO_TOKEN_PLAN_API_KEY
    max_concurrency: 16
  qwen-campus:
    channel: api
    region: cn
    protocol: openai-chat
    dialect: qwen
    # The campus gateway is the transport destination. `hetzner` is only the
    # models.dev metadata anchor for the exact Qwen3.8-27B model id.
    models_dev_provider_id: hetzner
    base_url: https://cqhbod8bjjjbcoakk8pmeebgkaq9akcq.openapi-sj.sii.edu.cn/v1
    api_key_env: INF_API_KEY
    max_concurrency: 16
    network:
      local_address_env: QWEN_LOCAL_ADDRESS

profiles:
  truth-deepseek:
    account_id: deepseek-api
    selector: { kind: exact, model_id: deepseek-flash }
    description: 高吞吐世界真值裁决
    allowed_roles: [truth-perception, truth-reaction-routing, truth-resolution, truth-transition, action-compilation, action-grounding, observation-renderer, causal-verifier, arrival-generator]
    response_transport: deepseek-sse-v1
    request_timeout_ms: 300000
    max_output_tokens: 131072
    # Preserve complete shared world contexts behind a bounded wire-size limit.
    max_input_bytes: 4000000
    inference:
      thinking: disabled
      effort: auto
      reasoning_budget_tokens: auto
      reasoning_summary: auto
      text_verbosity: auto
      temperature: auto
      top_p: auto
  truth-zhipu-coding:
    account_id: zhipu-coding-plan
    selector: { kind: exact, model_id: glm-5.3-flash }
    description: GLM Coding Plan 世界真值裁决
    allowed_roles: [truth-perception, truth-reaction-routing, truth-resolution, truth-transition, action-compilation, action-grounding, observation-renderer, causal-verifier, arrival-generator]
    request_timeout_ms: 300000
    # Truth outputs are compact JSON decisions; a bounded output avoids
    # needlessly large allocations on the Coding Plan endpoint.
    max_output_tokens: 65536
    # Blackmarsh observation contexts include the full candidate world and
    # can exceed 2 MB while remaining well within GLM-5.3-Flash's 1M-token
    # context window.
    max_input_bytes: 8000000
    inference:
      thinking: disabled
      effort: auto
      reasoning_budget_tokens: auto
      reasoning_summary: auto
      text_verbosity: auto
      temperature: auto
      top_p: auto
  truth-qwen:
    account_id: qwen-campus
    selector: { kind: exact, model_id: Qwen3.8-27B }
    description: 校园网 Qwen3.8-27B 世界真值裁决
    allowed_roles: [truth-perception, truth-reaction-routing, truth-resolution, truth-transition, action-compilation, action-grounding, observation-renderer, causal-verifier, arrival-generator]
    request_timeout_ms: 300000
    # Qwen3.8-27B exposes a 1,010,000-token context window. Blackmarsh
    # action-compilation contexts can approach that ceiling, so leave ample
    # headroom for the structured response instead of requesting the GLM-sized
    # 65k budget.
    max_output_tokens: 16384
    # Keep each physical batch below Qwen's one-million-token context ceiling;
    # eager-reference will bisect the 12-slot logical batch when this limit is
    # reached, preserving all slots while leaving output headroom.
    max_input_bytes: 4000000
    inference:
      thinking: disabled
      effort: auto
      reasoning_budget_tokens: auto
      reasoning_summary: auto
      text_verbosity: auto
      temperature: 0
      top_p: auto
  agent-deepseek:
    account_id: deepseek-api
    selector: { kind: exact, model_id: deepseek-flash }
    description: 高吞吐自主角色心智
    allowed_roles: [agent-bootstrap, agent-mind, agent-reaction]
    response_transport: deepseek-sse-v1
    request_timeout_ms: 180000
    max_output_tokens: 8192
    # AgentMind batching carries the scoped graph/context contract; keep the
    # DeepSeek path usable at Blackmarsh scale after that contract grows.
    max_input_bytes: 524288
    inference:
      thinking: disabled
      effort: auto
      reasoning_budget_tokens: auto
      reasoning_summary: auto
      text_verbosity: auto
      temperature: auto
      top_p: auto
  agent-openai:
    account_id: openai-api
    selector:
      kind: latest-compatible
      include: ["gpt-*"]
      exclude: ["*audio*", "*image*", "*realtime*", "*transcribe*", "*tts*"]
    description: OpenAI 通用自主角色心智
    allowed_roles: [agent-bootstrap, agent-mind, agent-reaction]
    request_timeout_ms: 180000
    max_output_tokens: 8192
    max_input_bytes: 131072
    inference:
      thinking: auto
      effort: medium
      reasoning_budget_tokens: auto
      reasoning_summary: auto
      text_verbosity: auto
      temperature: auto
      top_p: auto
  agent-xai:
    account_id: xai-api
    selector:
      kind: latest-compatible
      include: ["grok-*"]
      exclude: ["*image*", "*vision*"]
    description: xAI 高强度自主角色心智
    allowed_roles: [agent-bootstrap, agent-mind, agent-reaction]
    request_timeout_ms: 180000
    max_output_tokens: 8192
    max_input_bytes: 131072
    inference:
      thinking: auto
      effort: high
      reasoning_budget_tokens: auto
      reasoning_summary: auto
      text_verbosity: auto
      temperature: auto
      top_p: auto
  agent-zhipu:
    account_id: zhipu-api
    selector: { kind: latest-compatible, include: ["glm-*"] }
    description: 智谱 API 自主角色心智
    allowed_roles: [agent-bootstrap, agent-mind, agent-reaction]
    request_timeout_ms: 180000
    max_output_tokens: 8192
    max_input_bytes: 131072
    inference: &automatic-inference
      thinking: auto
      effort: auto
      reasoning_budget_tokens: auto
      reasoning_summary: auto
      text_verbosity: auto
      temperature: auto
      top_p: auto
  agent-zhipu-coding:
    account_id: zhipu-coding-plan
    selector: { kind: exact, model_id: glm-5.3-flash }
    description: GLM Coding Plan 自主角色心智
    allowed_roles: [agent-bootstrap, agent-mind, agent-reaction]
    request_timeout_ms: 180000
    max_output_tokens: 8192
    max_input_bytes: 524288
    inference:
      thinking: disabled
      effort: auto
      reasoning_budget_tokens: auto
      reasoning_summary: auto
      text_verbosity: auto
      temperature: auto
      top_p: auto
  agent-qwen:
    account_id: qwen-campus
    selector: { kind: exact, model_id: Qwen3.8-27B }
    description: 校园网 Qwen3.8-27B 自主角色心智
    allowed_roles: [agent-bootstrap, agent-mind, agent-reaction]
    request_timeout_ms: 180000
    max_output_tokens: 8192
    max_input_bytes: 8000000
    inference:
      thinking: disabled
      effort: auto
      reasoning_budget_tokens: auto
      reasoning_summary: auto
      text_verbosity: auto
      temperature: 0
      top_p: auto
  agent-minimax:
    account_id: minimax-api-cn
    selector: { kind: latest-compatible, include: ["MiniMax-*"] }
    description: MiniMax API 自主角色心智
    allowed_roles: [agent-bootstrap, agent-mind, agent-reaction]
    request_timeout_ms: 180000
    max_output_tokens: 8192
    max_input_bytes: 131072
    inference: *automatic-inference
  agent-minimax-token-plan:
    account_id: minimax-token-plan-cn
    selector: { kind: latest-compatible, include: ["MiniMax-*"] }
    description: MiniMax Token Plan 自主角色心智
    allowed_roles: [agent-bootstrap, agent-mind, agent-reaction]
    request_timeout_ms: 180000
    max_output_tokens: 8192
    max_input_bytes: 131072
    inference: *automatic-inference
  agent-kimi:
    account_id: kimi-api-cn
    selector: { kind: latest-compatible, include: ["kimi-*"] }
    description: Kimi API 自主角色心智
    allowed_roles: [agent-bootstrap, agent-mind, agent-reaction]
    request_timeout_ms: 180000
    max_output_tokens: 8192
    max_input_bytes: 131072
    inference: *automatic-inference
  agent-kimi-coding:
    account_id: kimi-coding-plan
    selector: { kind: latest-compatible, include: ["kimi-*"] }
    description: Kimi Coding Plan 自主角色心智
    allowed_roles: [agent-bootstrap, agent-mind, agent-reaction]
    request_timeout_ms: 180000
    max_output_tokens: 8192
    max_input_bytes: 131072
    inference: *automatic-inference
  agent-mimo:
    account_id: mimo-api-cn
    selector: { kind: latest-compatible, include: ["mimo-*"] }
    description: MiMo API 自主角色心智
    allowed_roles: [agent-bootstrap, agent-mind, agent-reaction]
    request_timeout_ms: 180000
    max_output_tokens: 8192
    max_input_bytes: 131072
    inference: *automatic-inference
  agent-mimo-token-plan:
    account_id: mimo-token-plan-cn
    selector: { kind: latest-compatible, include: ["mimo-*"] }
    description: MiMo Token Plan 自主角色心智
    allowed_roles: [agent-bootstrap, agent-mind, agent-reaction]
    request_timeout_ms: 180000
    max_output_tokens: 8192
    max_input_bytes: 131072
    inference: *automatic-inference

model_overrides:
  deepseek:
    deepseek-flash:
      disabled: false
      name: DeepSeek-V4.1-Flash
      family: deepseek-flash
      reasoning: true
      reasoning_toggle: true
      reasoning_efforts: []
      tool_call: true
      structured_output: true
      temperature: true
      release_date: "2026-09-10"
      last_updated: "2026-09-10"
      modalities: { input: [text, image], output: [text] }
      limit: { context: 1048576, output: 393216 }
  hetzner:
    Qwen3.8-27B:
      # The internal gateway is text-only even though the public metadata
      # advertises the upstream model's optional image input.
      modalities:
        input: [text]
        output: [text]
      # The campus endpoint accepts the explicit chat-template toggle used by
      # the qwen dialect even though models.dev does not advertise it.
      reasoning_toggle: true
  zhipuai-coding-plan:
    glm-5.3-flash:
      # The Coding Plan endpoint accepts explicit thinking disabled even though
      # the remote catalog does not declare the toggle capability.
      reasoning_toggle: true
      # The OpenAI-compatible endpoint supports JSON mode; use it instead of
      # function-call schemas for Truth's top-level discriminated unions.
      structured_output: true
