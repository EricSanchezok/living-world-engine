disclosure:
  default_check_visibility: full
laws:
  - id: positive-time
    text: 行动需要正数时间；赶路、修炼、检查货物、交谈与制作依内容、距离和手段花费时间。
    severity: hard
  - id: situated-world
    text: 只可从真实位置行动。空间包含关系不是瞬移通道；人界与灵界相互隔离，无已建立且满足条件的跨界手段不能通行。
    severity: hard
  - id: local-knowledge
    text: 人物只依据自己的经历、听闻和推理行动；隐藏灵根、私人动机和异地货物不会自动成为共同知识。
    severity: hard
  - id: open-future
    text: 开篇之后由行动与因果推进；没有强制加入七玄门、强制拜师、强制发现小绿瓶或必然重演小说的要求。
    severity: hard
  - id: root-discovery
    text: 灵根检测揭示既有资质，不能按愿望重写。尚未测过不等于无灵根；普通修炼需要相应资质、功法和时间。近身验灵手艺需要检查者已经学会、有可消耗法力并实际接触受检者完成检查，不能只凭声称或外观判断。检测结果首先属于检查者的观察，须另行报告才传给其他人。其他已建立的检测法按各自适用条件判断。
    severity: hard
  - id: learned-means
    text: 境界、已学技能、当前法力、实物与位置共同决定能力。凡人不能凭自称施法；化神修士也不能读取未知事实或替代调查。
    severity: hard
  - id: resource-conservation
    text: 钱币、灵石、粮食、药材和货箱只能从真实库存转移，或经已存在来源与工序生产；消耗、损坏和遗失必须有因果。记账数字不是实物数量。
    severity: hard
  - id: ownership-and-obligation
    text: 持有、所有、管理与受托运输不同。只有实际授权或愿意承担后果的侵夺才能处置他人资产；违反约定产生社会后果，不等于物理上不可能。
    severity: soft
  - id: mana-cost
    text: 施法须有已学手段和足够法力；这些出身已学的基础短程御物一次至少消耗一格法力，持续或大规模作用按对应法诀结算。恢复须真实休息、修炼或已有丹药，不得借交易凭空恢复。
    severity: hard
  - id: grounded-world
    text: 行动以真实存在的地点、人物、资源与技能为依据。未知信息须通过实际调查、交流或学习取得；人物猜测不是客观事实，叙述不能凭空补出资源、完整传承或必然的未来。
    severity: hard
  - id: authored-workflows
    text: 交易、工钱、债务、加工、调查与采集以实体、文书、库存和本人已知手艺为准。报价不等于成交；收到款或货物才能减少相应义务。到期只形成履约压力，不自动转移财产或强制人物接受条件。加工须扣除真实材料并经过工时，不能仅凭叙述生成产物。未知状态保持未知；可以拒绝委托或离开，并承受实际因果。
    severity: hard
  - id: daylight-and-illumination
    text: 昼夜时段与眼前照明分别判断。日间不意味着密室或洞穴有天光；夜间也可能有月光、灯火与照明法术。观察远处和辨认细节须满足真实光照、遮蔽、距离与观察者能力。
    severity: hard
  - id: local-admission
    text: 七玄门当前常规招收接受七至十二岁、经实际举荐的儿童；年龄或人情例外属于掌权者的决定。申请、考试、录取、拜师须分别实际发生，不能因剧情身份跳过。韩立、张铁与舞岩均可拒绝。
    severity: hard
  - id: local-private-realm
    text: 余子童寄居墨居仁体内，在没有成立的探查手段前，不进入旁人的视觉或共同知识。他们的秘密合作不让任何一方知晓他人的全部私念。
    severity: hard
  - id: local-conflict
    text: 七玄门与野狼帮有既存利益冲突，但是否交涉、扩招、开战、获得军械或雇到修士由真实行动与资源决定；小说中的攻山、死契斗与死亡不自动触发。
    severity: hard
  - id: local-orders-are-social
    text: 帮规、死契、门派令牌和工资约定是人的承诺、权限及执行行为，不能自动剥夺角色意志或隔空伤害。处罚与违约追索须通过有能力和获知信息的人实际采取行动。
    severity: hard
  - id: local-cavern-physical-controls
    text: 山体机关必须有真实传动、操作与对应结构才能发生效果。局部二号毁殿不等于全山都已坍塌；损坏、禁入、维修和耗料都须核实。人物威慑话语不直接作为既成破坏提交。
    severity: hard
  - id: local-chousui-dose-and-remedy
    text: 抽髓丸以透支身体潜力和寿命换取当前武力。通常整粒用药会形成周期续服需求，并带来抽筋吸髓的剧痛；直接停药可能瘫痪或死亡，持续照常服药亦会在初用后十年内耗尽生命。小剂量用作其他药的药引与普通服法不同，不自动套用整粒服药的后果；另配救治秘药须有真正掌握方法的医者与相应药材，可能保命却不能尽复寿命并会失去武功。原料、配方、用量、实际服用与治疗均须成立，知道药名不能凭空得到药物或疗效。
    severity: hard
  - id: cultivation-stages
    text: 修炼层级依次为炼气、筑基、结丹、元婴、化神、炼虚、合体、大乘，最终渡劫飞升。境界与功法层数分别记录；改变境界须实际完成相应修炼与突破。数值评价不能替代具体功法、伤势、法宝、经验与环境，也不使高境界者自动知晓秘密。
    severity: hard
  - id: cultivation-roots
    text: 常规修炼需要已存在的灵根、适用功法与实际学习。五行灵根及变异灵根影响功法适性和修炼效率；四五属性称伪灵根，二三属性称真灵根，单一属性称天灵根。伪灵根不是不能修炼或不能突破的物理禁令。血缘只影响可能性，不能据亲属关系重掷已经确定的灵根。检测与改变灵根是不同的行动。
    severity: hard
  - id: cultivation-lifespan
    text: 境界提升通常延长寿命：人界常见筑基两百余年、结丹四五百至五六百年、元婴约千年，均为概数。年龄、伤损、耗寿秘术与具体延寿方法共同影响状态；驻颜不等于延寿，寿宴称谓不必等于实岁。反复服同一药物不自动叠加无限寿元，也不能凭突破宣言抹去实际损耗。
    severity: hard
  - id: cultivation-stone-energy
    text: 灵石可用于交易、修炼、施法补充与法阵供能。使用须有实物、可用剩余灵力和相合的手段；耗尽的灵石不能继续作为未消耗的库存使用。灵石分低阶、中阶、高阶及更高等级，并有属性差异。持有灵石不等于自动学会法术，也不能无成本复制灵石或瞬时获得任意境界。
    severity: hard
  - id: cultivation-stone-exchange
    text: 人界常见报价以一枚中阶灵石比一百枚低阶灵石，但实际兑换需要交易双方同意和真实库存。高阶灵石的稀缺、供能优势和当地需求会影响成交；报价不是自动兑换接口，不能把账面比值当成凭空生成另一档灵石的工序。
    severity: soft
  - id: cultivation-foundation-bottleneck
    text: 突破须有已达到的修为基础、相应功法、足够时间与真实辅助条件。筑基丹是越国常用的突破辅助和重要资源；丹药供给、宗门资格与招生年龄是具体社会制度，不能改成全世界唯一的修炼入口。服丹不保证突破，不服丹也不能只凭愿望宣称已突破；特殊路径须具备已经建立的依据与代价。
    severity: hard
  - id: cultivation-five-elements
    text: 化神修士冲击炼虚须解决五行合一，并具备修为、功法和突破条件。可通过相应兼修、改修或已成立的特殊手段达成；多属性修炼仍耗费时间与资源。满足五行条件、获得辅助丹药或读到秘术，都不是自动突破成功。
    severity: hard
  - id: cultivation-substitute-roots
    text: 丹灵根用于已有灵根者补足属性，须真实材料、秘术与炼化；不能据此给无根凡人直接添根。器灵根和后天获得灵根另有罕见路径，天元圣皇的经历证明无根并非永远绝无可能。须取得相应机缘、已存在的传承和资源并实际完成过程；这些例外不是开局赠品或愿望保证。
    severity: hard
  - id: cultivation-spirit-tribulations
    text: 灵界人族元婴、化神通常每三百年小劫，炼虚以上通常每三千年大劫；不同族群的寿元、功法与天劫周期可能不同，不能给所有族群套同一周期。从个人实际渡劫史计时，后劫通常趋强；特殊功药、压制与外援可改变后续时间或强度。雷劫并非所有劫难，任何次序与胜率须区分种类和当事条件，原著成功不保证重演。
    severity: hard
  - id: cultivation-void-longevity
    text: 炼虚以上在天地元气供应充分时可不受普通自然寿元上限制约，但仍会受伤、遭劫和死亡。不能据寿元长久获得无敌、无限法力、全知或免除资源需求；也不能为制造开场困难而无原因降低现有境界。
    severity: hard
  - id: cultivation-ascension-residue
    text: 下界飞升者与灵界土生居民的经历不同。异界气息、灭尘丹使用与渡劫记录按人物事实处理；不能因为人在灵界就一律要求服药或加入天渊卫。服药须有真实药物和过程；供药条件由对应组织制度与实际协商约束，不能免费自动获取。
    severity: hard
  - id: cultivation-spiritual-perception
    text: 神识与灵目须实际施展，受距离、隐匿、防护、对方能力、消耗与具体手段制约。未察到不保证不存在；感知到不等于识身份或读取思想。搜魂、强破禁制和神念交锋可能伤己、被反制、只获部分记忆，或触发受搜者的实际禁制。看到传音不等于听到内容；结果只先进入感知者认知，再依传播到他人。
    severity: hard
  - id: cultivation-storage
    text: 储物器具有真实容量、收取方法和内部物品。普通储物袋以灵力收取物品，不能存放存活生灵；灵兽袋等专门器具按自身已知功能处理。低阶袋通常没有认主保护，持有人可能取出其中物品，但取得袋子不抹除物品原有权属、债务或失窃后果。袋中未被取出或实际探明的东西，不因同场出现而公开。
    severity: hard
  - id: cultivation-alchemy
    text: 炼丹需要已获得的丹方知识、足够且合用的原料、能承受火候的丹炉、适用火源、时间与操作者。某些真火要求可由合适的地火设施满足，不能把“自己没有筑基真火”自动判为永远不能炼丹。药性、年份、份量、火候和手艺影响成败；失败也消耗材料。丹药效果按具体丹方和身体状态生效，驻颜不自动延寿或精进修为，连续服药也不能消除适性与瓶颈。
    severity: hard
  - id: cultivation-crafting
    text: 炼器与修补须具备对应手艺、合适材料、工具和可持续的火力、法力与工时。材料原有硬度、灵性和属性会影响可制之物；废料不能仅改名字就等同成品。长期工序逐段记录已消耗材料、在制品和进展，中断须按当时工序判断可否保全，不能一边保留原料一边获得成品。制成、掌握驱动方法与日后培炼是不同阶段。
    severity: hard
  - id: cultivation-talismans
    text: 绘符需要掌握该种符图、实际符材和丹砂、适用笔具、灵力控制与时间。外形相似、初现灵光或练成另一种符箓，不证明本符成功；失败可能废纸、泄灵或燃毁，材料仍被耗用。封存法术的符箓与辅助施展符术的符纸分开处理，后者还须使用者懂得相应法诀。使用效果、次数和消耗由该张符箓的已成立性质决定。
    severity: hard
  - id: cultivation-talisman-treasure
    text: 普通符宝封存制作者本命法宝的部分威能，制作耗原宝和自身元气，使用耗封存量；持有者是否会凝炼影响效力，普通回气不能重充已耗威能。血脉限定的真宝是另有秘法、一次耗尽的特例，非匹配者注灵会自毁。不能将符宝、真宝、普通符箓与完整法宝混为一类或凭名称复制产量。
    severity: hard
  - id: cultivation-natal-treasure
    text: 实际占有、产权、认主与会用法宝分别记录，夺取不自动完成洗炼和掌握；本命物受损可能反噬主人。可发挥威能还受法力、神识、身体承受及已学诀法限制，低境可能只能用部分，高境也不一定能全催。玄天之物尤其会巨耗真元并伤弱躯。器物变形、合分、化虚后复现按同一来源追踪，不借描述增出重复库存。
    severity: hard
  - id: cultivation-transmission
    text: 传送需要可工作的法阵、真实能源、有效连接和适合乘员的保护；被破坏、未修复或目的地不明的阵法不能直接当成通行路线。短距与远距的风险不同，大挪移令和传送符按各自保护范围及次数生效，不能凭知道地名生成坐标或瞬移。收费、通行许可、护送和管制是运营者的制度，须与法阵的物理可用性分开。
    severity: hard
  - id: cultivation-possession
    text: 普通人界夺舍须有可行动的元神、可承受的修士肉身及胜过对方反抗的力量。对无修为凡人的强行夺舍有肉身崩溃风险，已夺舍次数也构成约束。离体元神会耗损，藏入他人躯体可能遭同化，不能无代价无限换身。玄魂炼妖、特定族群天赋等特殊附身手段须另具传承、修为、形态和目标条件，不能仅说“用秘术”就取消限制。肉身破坏、元神被灭与人物死亡须分别查明。
    severity: hard
  - id: cultivation-soul-restoration
    text: 保住魂魄、养魂、夺舍、还魂与完整复生不是同一件事。还魂须有尚存且可用的魂魄、合适的新死躯体、对应秘术与法阵、场所和施术者，可能重损修为。养魂宝物不能自动消除所有神智损害；已彻底消散的元神不能因为存在还魂术就无依据恢复。具体成功、失败或反噬由现场条件决定，原著中曾经成功或失败不保证重演。
    severity: hard
  - id: cultivation-nascent-soul
    text: 元婴离体时肉身、元婴、法力和随身物分别保留真实状态；逃遁、神游各有条件与可被克制的手段，不能必然逃生。毁身、魂散、失去某个分身和主体最终死亡不同，须核对已存在的魂体关系与实际遭遇。没有证据不能临时生成备用魂续命，也不能只凭外界死讯删除尚存者。
    severity: hard
  - id: cultivation-calendar-observation
    text: 人界与灵界共享连续经过时间，但当地天象与昼夜不同。灵界的七曜在白昼炽热、入夜清冷，昼夜显著长于人界；洞窟、秘境、阵法遮蔽或当地天气可影响能否看见天象。初始时段只描述入场那一刻，后续光线必须按所在地的历法与经过时间判断，人物只能从其实际感知或已有钟历知识获知。
    severity: hard
  - id: cultivation-calendar-calibration
    text: 世界计时以秒连续累计。运行标定：人界一昼夜86400秒，灵界当地一昼夜345600秒；两界一时辰均为7200秒。人界T0为夜间21时；灵界T0为当地入夜后的第3个时辰。人界日出06时、日落18时，灵界昼夜各172800秒，按各自循环推算。普通约定的“明日、三日后”按签约当地昼夜；跨界合同须说明采用哪一地。修士岁龄、典籍中的年数和天劫年限采用统一人界年365日；一月作为时长用30个人界日。明确说“灵界本地月”才取30个灵界昼夜。计时不会自动使工序成功、资源到账或未来剧情发生。
    severity: hard
  - id: cultivation-hidden-roots
    text: 隐灵根须有既定体质、血脉与显隐条件。消失期间可以确实没有可供法修的灵根，并非每次都是检测失误；既有体术与法修状态分别保留。正常检测只能揭示当时实际状态，不能按愿望重掷。已明确无根者也不自动补成隐根。隐藏资质、检测发现及向别人告知是不同事实。
    severity: hard
  - id: cultivation-mortal-body-training
    text: 凡俗武艺内力、灵界借外灵气炼体和以灵根修炼法力是不同路径。无根者可在实际传承、身体条件和资源支持下练适合的体术，不能因此直接获得法力或所有法术。体修强度、身体损耗和已会招式分别处理；凡俗武功不会仅因名字带气就变为仙法。
    severity: hard
  - id: cultivation-avatars-and-cognition
    text: 分魂、第二元婴、借体、傀儡与幻影依具体法门分别建立。需要真实魂体、材料和过程，不免费复制完整人物、能力与资产；分离载体可有独立经历和反噬风险。共享早年记忆不等于随时共享当前观察，远行感应或回报须有实际联系。分身受封时可用的其余能力按封禁范围判断，不能无因恢复或全部清零。
    severity: hard
  - id: cultivation-combat-conditions
    text: 境界只是能力的一部分。胜负依当前法力、神识、身体、功法适性、真实器物、环境、距离与准备判断；强者也可能受伤，越阶行动也不被等级数字直接禁止。抗毒、再生、遁术、克制和不灭之体均有具体适用条件；挡过一次不等于免疫所有攻击。暂时加持、燃血与强催后的真实代价不等于永久突破。
    severity: hard
  - id: cultivation-heart-demons
    text: 心境破绽、心魔试炼、域外魔念和幻术分别按真实诱因与手段处理。幻中物品、死亡与经历不自动写成外界真实资产或历史；真正的神魂损伤仍可影响现实。清心、强神识和护符不是绝对免疫。大乘突破的五行、真雷、心试有各自危险，不能把心试失败一律等同立即死亡。
    severity: hard
  - id: cultivation-oaths-and-choice
    text: 门规、禁售、保密约定与债务是社会约束，当事者仍可选择违背并承担实际后果。心魔誓、血契、禁神术与传承禁制只有在真正成立后才有各自效力、触发条件和解除代价，不能仅靠承诺生成控制。受威胁、被魅惑或遭控制不等于自愿；原著中的归附也不强制重演。
    severity: hard
  - id: cultivation-species-and-transformations
    text: 人族、妖兽、真灵、木族、灵族与特殊体质各有实际修炼路径，名称相似不等于同一族。常见妖兽七级进八级经历化形劫，开智、人形和境界仍须按物种及个体判断，古禽等有例外。变形不复制主体，召出的法相也不自动成为真实新生灵。驯养、吞噬与真血炼化需要相应手段，不保证服从或进阶。
    severity: hard
  - id: cultivation-arrays-and-maintenance
    text: 布阵、移动阵器、维护和破阵均依真实阵图知识、材料、供能、位置、时间与操作者。某处阵眼被毁或供能改变会影响该阵，不能凭阵名获得无限防护。幻阵制造感知不生成真实人和货物；同行者是否受护由覆盖范围与实际操作决定，不能自动按友敌标签豁免。
    severity: hard
  - id: cultivation-crossworld-environment
    text: 不同界面的灵气、魔气与界面之力影响修炼、施法和通行，需真实适应与保护。人界化神强动天地之力可能损寿；上界来者会受本界压制，不能照搬完好原境能力。飞升、节点偷渡与投送分魂是不同手段，知道地名不能跨界。环境变化、禁制和保护能力可以改变结果，不强制任何人重走原著路线。
    severity: hard
  - id: cultivation-cultivating-resources
    text: 培药、灵兽繁育、采矿与炼丹依真实个体、生境、工序和有限原料。掌天瓶的催长也需要合适灵气，薄灵之地可能失败；普通草药、妖丹和已炼成药不能任意互换。可助突破的药、功法与天赋效果须按适性和实际过程验证，人物估计的年数或胜率不是自动到账的升级承诺。
    severity: hard
  - id: spirit3-body-route
    text: 无灵根不等于无法锻炼或学习灵界炼体法。cultivation表示常规修仙境界；肉身训练由实际已学手段、force、伤势、环境、药物与时间判断。不得把cultivation为0解释为必定不敌有法力者，也不得把一次基础课自动变成突破。
    severity: hard
  - id: spirit3-spirit-tools
    text: 灵具须具备实际器体、匹配驱动器、使用知识和有限灵石才能发动。装石是库存转移，耗尽须扣除真实灵石；既无实石也无其他已证供能源时不得产生灵效。器具只支持其已写明的动作和性能。灵具不会直接授予灵根、法力境界或高阶神识。
    severity: hard
  - id: spirit3-distant-travel
    text: 路线表示可经实际路径到达，不能把远城的route-to当作一瞬移动。跨城需按距离、交通、路况和补给推进；传送须已有起止阵、可用灵石、通行权限与操作，不凭一张地图生成新阵。城内公开道路不授予进入私宅、军塔或仓库的许可。
    severity: hard
  - id: spirit3-tenure
    text: 天渊城职务、甲衣、洞府居用权和商行经营权各须实际登记或已有凭证。境界符合门槛不等于已获职务；私有物、商行资产、机构预算与地块使用权分别核验。普通契约不自动施加血咒，血咒也需具体符物和成立条件。
    severity: hard
  - id: spirit3-conditional-beasts
    text: 兽潮与外族冲突须有当前兽群、领地、人口、组织意图与行动条件。三皇七妖协议是可被遵守或违反的社会约束；不得按章节日期强制发出兽潮、入侵、招募或死亡。守卫应依据实得情报行动，不预知后世战果。
    severity: hard
  - id: spirit3-knowledge-access
    text: 明示传闻、典籍记载与真实见证须分开。听说有生根灵药不等于已拥有地点与药物；擎天树通仙界的传说不构成可执行通路。看见灵压盘不能读取隐蔽气息、背包和秘密。来访办事时只有实际展示的相关文书才成为共同知识。
    severity: hard
  - id: spirit3-local-calendar
    text: 三境与天渊城契据的本地日按345600全局秒计，钟点、动作秒数保持统一；不得因本地昼夜较长而直接把人物年龄、寿元、三百年洗尘期或其他修炼年数乘四。具体到期按文书标明的时制计算。
    severity: hard
  - id: spirit3-ascender-context
    text: 只有具有实际下界来历或遗传异界气息者才按对应规则评估两色雷劫与灭尘丹需求。本土化神、炼虚身份没有自动飞升债务；新飞升者的登记、服丹与服务须真正发生，不能凭身份标题提前拥有全部经历。
    severity: hard
  - id: spirit3-shadow-talisman-limit
    text: 影符需真实符体、已存影力与操作知识。一次性符使用即扣除实体，影体不是新独立人物，不复制持用者个人记忆、库存或全部战技。传闻完美影符不能替代现有符的已写能力。
    severity: hard
  - id: spirit3-public-imperial-resources
    text: 皇府职务、公共库藏、私物与持位者身体分别存在。持印可提出命令但不使所有人自动服从；使用公款须真实划账。灵皇大比是社会程序，须有空位、参与者和实际比试，不按原著未来自动换人。
    severity: hard
  - id: spirit3-limited-wild-groups
    text: 野兽群量是当前成员数。死亡扣除，分离须转出对应数并保留伤势，治疗群体不得复活死员。羽、毒、体力的补充要遵守具体生理条件；兽群不会为剧情自动补满。
    severity: hard
  - id: demon7-person-and-form
    text: 妖族人形、兽形、魂体和化身应按实际主体与载体记录。变形不生成第二份库存，分魂不默认同步全部记忆；人物与族人不是领主可随意交易的物品。
    severity: hard
  - id: demon7-territory-and-politics
    text: 三皇七妖的约定、王庭许可和社区权属是可以违背但有社会后果的规范。境界高不等于知晓所有秘密、拥有所有族产或能无条件命令各方。
    severity: hard
  - id: demon7-soul-devouring-rule
    text: 灵魂吞噬只对确实已学此术且有可行动魂体者成立，须实际进行元神争战并承担反噬、受灭风险。借体期限和同化取决于状态；器灵、族属和灵魂同源本身不自动授予此术，更不能跳过所依赖的载体与克制条件。
    severity: hard
  - id: demon7-black-flame-production
    text: 黑炎丹需化神以上黑凤已修本命火及长期特殊积累，基本千年一颗；已炼出、许出或失去的丹都按真实库存计算，不能因许诺、任务或血脉标签凭空生成。突破效果按受用者实际准备与条件判断，不保证成功或统一百分比。
    severity: hard
  - id: demon7-crystal-silk-conservation
    text: 晶炎丝必须来自已实际成熟且未吐过唯一一丝的火虫，采集后将其生命期产丝状态记为已用。已有丝材按库存转移、编制或损耗；普通材料不能直接充当晶炎丝。未知其他产地不等于不存在，但不能靠传闻在当场刷新资源。
    severity: hard
  - id: tianyuan-dust-is-not-currency
    text: 灭尘丹的领取、持有、服用、疗程计数和异界气息变化是不同事实；必须发生真实转移与消耗。每年一份的常规疗程不能用一次吞服多份替代，不适用者不能凭称呼产生异界气息。
    severity: hard
  - id: tianyuan-registry-and-ownership
    text: 长老会公库、守卫任务款、玉阙阁居用权与个人财产分别存在。任务接取、验收、付款和授权要有对应行动；政治职位不自动拥有他人资产和全部知识。
    severity: hard
  - id: fengyuan-species-identity
    text: 木族、灵族木属性成灵者、器灵、夜叉和影族按各自主体与法体记录。同样名字中有木或灵，不构成同族或同一人；成灵者的载体不是他人可以无条件买卖的普通库存。
    severity: hard
  - id: fengyuan-shadow-limits
    text: 影族附体、隐匿与影傀儡依赖真实能力、载体与控制条件；克制力量要比较层级。影傀儡短时附体可在控制被解除后消散，不能一律先判宿主永久死亡；幻城不能制造真城和真人。
    severity: hard
  - id: fengyuan-border-choice
    text: 本区种族矛盾和通行禁条是现实利益与政治规范，不强制让任何遭遇变成战斗。擅闯、掠夺、失信会按被谁发现、谁有能力应对形成后果；知晓某地名字不等于掌握绕过禁制的方法。
    severity: hard
  - id: fengyuan-mingsha-hazards
    text: 鸣煞阴煞与风海按实际防护、暴露时间和行动造成影响；强者能抵御不等于任何随行者自动免疫。幻术、影形和灵王外显不能凭描述制造重复主体或实际新财物。
    severity: hard
  - id: fengyuan-shura-entry-and-reserve
    text: 修罗旧心护器初始保护余量10368000秒是本件标定。进入小修罗界才开始按实际流逝秒数扣减；不可转移给第二人又保留第一人的保护，也不得凭休息恢复。可操作安全返程须预设真实坐标、仍有余量时主动捏碎护器，并清空余量与标记毁坏。耗尽后的自动排斥与可能滞留为不同人物说法，不保证无损返回。未经开阵与真实跨界过程，地点关系不能当普通路。
    severity: hard
  - id: fengyuan-shura-native-agency
    text: 修罗蛛晶核是有限本命物，摘去不必立死但会造成实际损伤，现存死者遗核另有保管与数量。空鱼、修罗蛛和其附属者有独立判断，威胁、血誓和族长说法不自动批准全族转让；圣物认主须实际力量、材料、旧印记处理与法诀，不依出身文字凭空完成。
    severity: hard
  - id: fengyuan-dreamwatch-boundary
    text: 梦罗树只察觉实际连通范围内可感的变化；知觉不等于识别身份，过强遁术、树体损伤、未联根区域等均影响结果。当前八株和十里为标定，不能将后期旧情报中的炼虚阈值当永久漏洞。
    severity: hard
  - id: feiling-identity-and-blood
    text: 飞灵血脉、天鹏誓卷、器物祭炼和私人承诺分别核对。具有翅膀不自动等于飞灵身份；融合真血须有实际来源、适配条件、过程与代价，不能凭自称新增血脉。
    severity: hard
  - id: feiling-abyss-hazard
    text: 地渊各层的寒风、黑暗侵蚀和生物有实际强弱。看到下一层入口不等于可安全通过；领地控制与远征须由当前动机、实力和资源形成，叙事中的预言不直接改变状态。
    severity: hard
  - id: feiling-oath-and-access
    text: 天鹏之誓只约束实际签署并生效的主体；知晓誓名不等于签名。阅卷、亲授、采料、入渊等须由真实权限与实力判断，制度可被违反但会产生被发现和追责的可能。
    severity: hard
  - id: feiling-sha-armor
    text: 四煞化甲术将已有煞气依所学法诀凝成防护；煞气不足或法力受损会限制效果，不能把口述学习直接当作无限生成护甲和战力。
    severity: hard
  - id: feiling-one-dixue
    text: 地血的分神和血袍显化属于一个主体的技能。另造实体须建立真实身体、能力与代价，不能由相似外观复制第二份灵石、知识或独立所有权。
    severity: hard
  - id: feiling-local-ecology
    text: 地渊暗秽、神识压制、阴蛛蜂凝形和冰煞寒气按实际所在与已掌能力生效。采集消耗现有成熟资源；群体分离、伤亡须扣有限活体数量，不按一次战斗叙事补满。
    severity: hard
  - id: feiling-institutional-access
    text: 护城柱、族宝库和地渊守门各有实际权限。口头交好、持一张身份牌或有较高修为不自动赋予全部门禁控制权；挑战可以发生但必须处理守卫、禁制和实际代价。
    severity: hard
  - id: minghe-one-soul-and-one-body
    text: 青元子与姜姓老者为同一融合主体；第二元婴、附身傀儡和投影是具体手段，须有实际身体或载体，不能凭名称复制独立人物、知识或库存。
    severity: hard
  - id: minghe-conditional-entry
    text: 圣地许可、通道定位、破界、阴水防护和落点条件分别成立。持一张许可不使人具备大乘破界能力；发现隐藏入口也不使其成为安全商路。
    severity: hard
  - id: minghe-milk-conservation
    text: 冥河神乳的采集、封存、交易和服用作用必须分别核对。现有份额实际减少后才可转移或服用；特殊体质效果和突破可能依使用者条件判定，不自动改变境界。
    severity: hard
  - id: minghe-insect-maturity
    text: 虫种、数量、成熟程度、认主、神念负担和饲料是真实状态；未成熟虫不能借成熟体名声施展成年威力，也不能用一次喂养跳过长期培育。
    severity: hard
  - id: minghe-artifact-loan
    text: 五龙铡借出不等于赠送；驱动需要使用者神念与法力。主人已祭炼心神合一，依其现有能力可召回，同一器物不能同时在两个地方使用。
    severity: hard
  - id: minghe-observer-limits
    text: 七门锁阴阵的观测是阴气分布；读数差异需要查原因，不能据此直接写入全域人物行为和秘密。
    severity: hard
  - id: minghe-future-is-open
    text: 亲族仇怨、宝物欲求和洞府维护形成行动动机，具体联盟、袭击、借宝或收徒须在当前真实条件下发生；身世不预定死亡或必然获救。
    severity: hard
  - id: minghe-long-craft
    text: 碧灵酒、金罡灭魔雷和稀有灵虫的成熟有各自材料与过程，知道法门不是持有成品；时间流逝也不能替代缺失的原料和实际维护。
    severity: hard
  - id: minghe-limited-sacred-stay
    text: 普通蜉蝣族人在冥河长久停留会受损，护身器物可减轻眼前阴气而非取消长期风险。一次已筹备接引窗口不能推导随时开放；临时值守、撤回、复查和再次准备分别落实。
    severity: hard
  - id: innerstar-social-permits
    text: 城门身份、行商牌照、租约与岛政禁令是社会规则，可获许可、协商或违法，但违法有现实后果；不形成不死屏障或绝对无法行动的物理定律。
    severity: hard
  - id: innerstar-finite-sea-travel
    text: 海贸要有真实船体、载货、操舟能力、补给和时间；储物器容量与修士选择使海船仍有价值。航行、传送和御器不是写下目的地就瞬移成功。
    severity: hard
  - id: innerstar-cultivation-and-appearances
    text: 结丹延寿不自动逆转已经衰老的面貌；驻颜、改变形貌、真实年龄和境界分别判断，不能凭漂亮或年轻外表推出出生时间。
    severity: hard
  - id: innerstar-no-future-cargo
    text: 未来的劫货、逆星盟战争、六连殿叛乱及韩立取得宝物不自动发生。只有当前角色、资源、信息与实际行动使条件成立才会形成相应事件，结果可改变。
    severity: hard
  - id: innerstar-magnetic-window
    text: 元磁山只有一个真实主体。已受其约束的研修者，平日远离时必须判定反噬及当前法力条件，不能用口头意图取消限制；百年磁力全消窗口可解除此项牵制，但不使人瞬间到达远方、不消除其他禁制，也不授予未知终关解法。离开和回来都需真实移动。
    severity: hard
  - id: innerstar-alchemy-constraints
    text: 本海域常售高阶丹方以妖丹为主料，炼气低阶配方可不用。配方、适配辅料、炼制能力及实物必须具备；药性汇抄不等于完整配方。降尘丹一次冲关仅一颗，辅助液也不保证结丹成功，不能把传闻或举例百分比写成确定概率。
    severity: hard
  - id: innerstar-living-beast-storage
    text: 灵兽袋的缩小收容能力不属于普通储物袋；活兽仍有独立状态，未捕获或未驯服不能凭说话成为库存，奇虫排名不覆盖境界、成熟程度和相克条件。
    severity: hard
  - id: innerstar-soul-and-craft-boundaries
    text: 禁神牌控制须掌握法术的至少元婴修士与真实交付元神；毁掉该术所收元神部分可造成意识伤损乃至死，威胁不等于已经控制。附身受躯壳和法力限制，不能借名无损释放本体全部神通。炼器、炼符和傀儡须已掌握炼法、适合材料及实际耗料耗力；同名材料不会自行变成完整法宝。
    severity: hard
  - id: innerstar-real-tea-preparation
    text: 普通淡茶一杯需要实际消耗一份干茶和一杯可饮水，投入真实容器后才产出一杯成茶；饮用、洒掉或倒弃消耗对应成茶。水温随时间与环境变化，需热茶时必须已有热水或有实际燃料工具加热。补进干茶和水须从实际来源取得，不因提供服务自动补满。
    severity: hard
  - id: innerstar-artifact-spirit-distinction
    text: 法宝显化动物形状不等于已经封入该动物元神，不会仅凭形状获得对应完整神通。真实器灵封印需要有元神、相应法门与过程；强灵更难封入，不能以说出器灵名称替代实际来源和成功条件。
    severity: hard
  - id: innerstar-mutation-distinction
    text: 灵兽个体变异与蛮荒异种的种群演变不同。个体进阶的变异不能凭请求保证发生，也不能保证有益；异化之术的具体作用必须来自该个体已有能力。器物石化类能力不因此直接石化修士本体，仍需真实命中与条件。
    severity: hard
  - id: innerstar-void-transmission-exception
    text: 虚天内殿入口的普通传送时限不是对一切秘法无例外的定律。星宫有古老破解方法；实际突破该处时限须掌握对应方法并作用于相应传送禁制，不凭机构身份、宣称或别处传送能力自动成功。
    severity: hard
  - id: innerstar-tianqing-worm-cost
    text: 天青花强提金丝蚕道行的办法有药后严重废损代价，不能无害永久升级。使用须有实际花药、相应施用与灵虫，不把一种灵虫的一次经验推广成所有生灵同样有效。
    severity: hard
  - id: innerstar-thunder-reserve
    text: 金雷竹法宝的辟邪神雷有实际蓄量；释放消耗已有蓄雷，恢复需要相应静养过程，不能以材质名称承诺无限雷力。敌人的估计不是持有者实际剩余量，须依真实法宝、修养和已发生消耗裁定。
    severity: hard
  - id: innerstar-limited-mind-probing
    text: 迷魂取心声须有实际施术、相应神识和对象条件，只能得到该手段实际引出的部分内容，不能把一次迷魂等同完整读心或永久控制。此限制不抹掉其他已有法门各自经证实的作用。
    severity: hard
  - id: innerstar-egg-transit-resilience
    text: 普通未孵化灵兽卵不能默认承受传送；携带过阵需核对已知种类、特殊耐受或实际培育阶段，否则存在死亡结果。装入灵兽袋不自行授予抗传送能力，特殊兽卵按其真实例外条件判断。
    severity: hard
  - id: innerstar-borrowed-treasure-conditions
    text: 取得旧法宝不等于已完成炼化、心神相通或掌握全部神通。可以由他人使用的法宝仍按真实陪炼程度和其认主、器灵、禁制等条件发挥，不得以普通旧飞刀可用为由抹去其他宝物限制。
    severity: hard
  - id: innerstar-insect-time-and-loss
    text: 灵虫的繁殖、孵化、认主和调教必须依种类及实际阶段耗时；常见群居灵虫并非喊出驱虫术就有成熟大群。数量须来自真实繁育或转交，斗法损失不能在结束后自行恢复；有依据的催育仍需真实条件和代价。
    severity: hard
  - id: innerstar-jiao-individual-capability
    text: 蛟类的种族优势不使幼体自动达到八级，也不保证每只纯种越阶必胜；能力依实际个体、血统、修行与交战条件裁定。典籍估计不能直接替代本次战斗结果。
    severity: hard
  - id: innerstar-soul-return-cost
    text: 还魂术与夺舍不能混用：前者须可用魂魄、适合的新死肉身、结丹以上施术修为、玄阴场地与真实布阵准备，且付出严重修为代价并可能受扰失败；不从尸体凭空生成原有魂魄。活体夺舍按实际法门、元神和宿主条件判断，已成立限制不能借还魂之名规避；有据的特殊法门仍保留各自例外。
    severity: hard
  - id: innerstar-prepared-demonic-cost
    text: 阴魔斩等预凝精元的一次手段须已有实际凝炼并扣除消耗，不能靠同一句宣告无限续发。化劫避死须有已炼成的肢体替身并真实消耗；据说只有某境界能修的传闻不能抹去有据的个体例外，也不能向未学者自动授术。
    severity: hard
  - id: innerstar-manifestation-identity
    text: 飞剑分出的剑光与法术凝出的魔影按实际神通维系，不自动新增可拾取实剑或具有独立意识的人物；撤术、破坏和反噬按真实施法结构与能力处理。
    severity: hard
  - id: innerstar-secret-talisman-craft
    text: 密符须按该符真实用途和独有炼法制作；得到或观察成符不等学会全部符法，普通五行符也不因换称密符就具替身或跨海传送作用。
    severity: hard
  - id: innerstar-metal-working-materials
    text: 刀剑掺庚精、器物用罡银沙增强效果都须有真实材料、适用工艺及必要培炼，不因知道名称就补齐全套材料；材料增强锋利或坚固不使物品绝对不可损坏。
    severity: hard
  - id: innerstar-couple-cultivation-chance
    text: 星宫独门双修秘术需要真实传承与修行条件；所述提高进阶元婴后期机会不等于保证成功，结为夫妻或被许婚也不等于已经学会和完成此术。
    severity: hard
  - id: innerstar-soul-search-specific-guard
    text: 搜魂必须判定目标实际已修的守魂法与当前精魂条件。已有托天锁魂一类特定防护时，不得只因施术者境界更高就自动获得记忆或口诀；强行破坏可导致精魂消散且取不到内容。法名、传闻或境界本身不授予守魂能力，具体例外须有实际法门依据。
    severity: hard
  - id: innerstar-sea-array-active-protection
    text: 这条上古跨海传送阵须区分未激发与已开始传送：静置阵体可遭低阶修士破坏，传送开始后的强灵力灌注才提供原有防护，没有结丹以上修为不能仅以普通攻击摧毁此运行阵。保护不等于全场无敌；已损阵不会因知道位置或持大挪移令自动恢复，重布仍需实际材料、构造与施工，且另一端必须可用。
    severity: hard
  - id: innerstar-magnetic-access-and-movement
    text: 元磁山对五行法力和法宝的影响须按距离、停留、本人修法、防护及隔断禁制实际判断。误近可致灵力反噬，高阶也不保证久留无损；不含五行的法宝只是受影响较小。收取或搬移须有真实可行手段、法力和时间，拥有权、口头承诺或普通储物袋不使山自动缩小入袋。独修功法与借山修炼导致的灵力相系分别处理，不无条件给两者同一种束缚。
    severity: hard
  - id: thunder-cloud-civic-rules
    text: 云城街区禁斗和身份核验是社会制度，违犯由有能力知情的守卫与机构处理；不把规矩当作物理上不能动手。租洞、拜师、受邀、获准与实际交付各是独立状态。
    severity: hard
  - id: thunder-qing-cooperation
    text: 青族凝神归一需同胞、同功、近似境界与当下协作，不将所有青族私念互通，也不把临时合术形成第二套重复财产或独立本体。
    severity: hard
  - id: thunder-thunder-transit
    text: 跨大陆阵须真实端点、接应、许可和特殊耗材；普通城际阵、已损海外古阵、广寒入口不是同一种可互换通行能力。广寒令未出现时，仪器、传闻和旧拓本不能凭空生成入口。
    severity: hard
  - id: thunder-mojin-seal
    text: 魔金封锁与魔气侵蚀依实际境界、法体、防护、停留时间及阵况生效；开放计划可变，圣阶以下常规许可不是对高阶强闯能力的绝对物理否定。隐宫古部属没有对整个山脉的实时全知。
    severity: hard
  - id: outerstar-bounded-transit
    text: 本区传送按实际已存在阵口、护身符、人数与燃料结算。单趟付款转入对应公库；使用者的一次护符随成功使用耗尽。灵石不能同时用来支付又当燃料消耗。没有成功启阵不得宣称到达远方。
    severity: hard
  - id: outerstar-ecology-and-hunting
    text: 妖兽有真实生命、境界、法体、栖地与库存。捕猎成功、妖丹取得和材料分割须有相应行动与损耗；只有明确存在的目标才可扣减群体数量，鱼群不会自动刷新。霓裳草依珊瑚生境、年龄和展叶阶段生效，栽种未满百年再拔起会损坏引妖效用。引妖气味不能自动诱来已开灵智的化形妖兽；具体效用须核对物种、实际灵智和当前状态，不能只凭等级一概判定。
    severity: hard
  - id: outerstar-claims-and-consent
    text: 雇佣、寄售、职业与城规都是可执行也可违犯的社会关系，权势不等于不可拒绝。商人说法与广告不是事实，活物运输风险不因买卖承诺消失。现有族群敌意不强制复现原著未来的战争、死亡和交易。
    severity: hard
  - id: outerstar-unique-remains
    text: 雷鹏翼骨、梵圣真片和矿体中极品灵石必须从本区已有唯一实体转移。未来的风雷翅炼制、取片和开矿尚未发生，不可按原著未来给角色增加装备、记忆或地图。
    severity: hard
  - id: outerstar-no-fixed-hunt-roll
    text: 出海规模、草龄和妖兽品级影响风险，不使特定战斗或兽潮按固定人数必然出现。神识受隐匿、海域与距离限制；海图和人传情报须结合实际观察。
    severity: hard
  - id: outerstar-egg-life-before-transit
    text: 多数兽卵不能承受长距传送，具体种类的例外须有既定物性或实际证据。孵化和成长需要已有食物、时间与养护；买卖许诺不能让卵瞬间长成或消除传送损伤。
    severity: hard
  - id: guanghan-closed-realm
    text: 广寒当前闭合。已知常规入境需要实物令、有效时机、激发者和适用接引设施；旧记述和拓印不会创造入口。特殊潜入有古史个例，但必须具备确实足以越界的能力与方法，不能据传闻免费跨界；未来开启不是强制日程。
    severity: hard
  - id: guanghan-ancient-preservation
    text: 古物、药株、丹药、古香和阵上灵石各有有限实体与库存；发现、取得、鉴定、学会和炼成是不同状态。损坏禁制可改变危险与后续通行，不能既带走供能石又保持原阵满额运作。
    severity: hard
  - id: guanghan-mind-learning
    text: 炼神石壁只含前三层。解字、获得全文与满足修炼条件各需证据，之后仍须实际修炼；前期增幅伴随神识和肉身负担，不能以读文、自废或夺舍直接消除长期风险。普通人物只知道亲历或读到的部分。
    severity: hard
  - id: guanghan-star-consequences
    text: 星阵灌体的结果依实际法体、神识、分流手段与阵况；不复制后来韩立独有物品救场。毁坏关键构件可造成阵力紊乱和空间风险，未毁坏前不得提前坍塌或给出固定胜利奖励。
    severity: hard
  - id: guanghan-native-and-entry
    text: 令牌的圣族进入限制适用于外来传送，不抹除本土合体生灵，也不禁止在界内真实突破；突破需有积累和条件。旧图、旧次安全记录与族人经验均可失准。
    severity: hard
  - id: guanghan-partial-text
    text: 炼神经文分在五处石壁，抄一处不是全文；阅读、收齐、解释、满足修法条件与修成分别记录。临时访客、未来传授、盟约与占领不凭预知小说成立。
    severity: hard
  - id: guanghan-material-and-medicine
    text: 太乙青山、画卷、丹药、活药株、原矿与生物各有有限存量和实际位置，拆取会改变原结构；秘境丹药不可因别名翻倍。生服异药须计药性积压、炼化和身体代价。
    severity: hard
  - id: void-closed-ruin
    text: 虚天殿当前处于关闭期，世界中没有未来寻宝集会。三百年周期由古阵状态推进，不按韩立章节触发；特殊操纵需实际虚天鼎、控制法阵、通宝诀和足够协同法力。普通空间遁移不能绕开完整塔壁禁制。当前相位标定为上一轮后约一百年，下一自然窗约二百年后；改变法阵可改变开启条件。
    severity: hard
  - id: void-bounded-artifacts
    text: 本区虚天鼎、狼首玉如意、失忆器灵、玄阴经、九曲灵参及养魂木均对应当前唯一实体。化身、幻象、记忆和未来所得不能生成第二份身体或库存。取宝、毁物、消耗药液和炼器须真实转移与结算。
    severity: hard
  - id: void-conditional-trials
    text: 试炼的鬼雾、热寒、禁飞、宝室和幻境是有适用范围的机关。正常取宝传出有可研究例外，退出和改道也须满足真实通路。不得以原著过关或死亡结果替代当下能力、耗损和选择。幻境只呈现能成立的心智刺激，不把未来百科灌入当事人。
    severity: hard
  - id: void-private-history
    text: 极阴与玄骨旧怨、夫妻关系、师门亲属和门派职务不意味着全知或服从。后来的逆星盟、万天明替身、温夫人炼尸、收韩立为徒、玄骨夺曲魂均未发生。人物依据真实消息行动，可以拒绝交易、借物或入殿。
    severity: hard
  - id: void-pills-not-universal-roots
    text: 补天丹洗炼已有先天灵根的长期过程不能替代无灵根者获资质；元婴突破、寿元延长传闻不是客观保证。九曲灵参配方和万年灵乳分别有适用条件，不能复制灵药、忽略辅料或跳过炼化。
    severity: hard
  - id: void-garment-and-relative-gates
    text: 遗骨与所披衣物分别移动，取衣不自动带走遗骨；辟火宝衣仅有与材质和炼制相符的防护，不能免疫所有火焰。殿门、厅端阵与试炼窗口须依实际古阵状态生效，不能把某次聚会等待的第四日写成所有开殿的固定第四日。
    severity: hard
  - id: void-ginseng-capture-conditions
    text: 九曲灵参化身与本体是一命，受惊可遁山石；纯金捕捉手段及能限制当地土石遁行的有效阵法可构成捕获条件，仍须实际设置、引诱和行动。辨清灵之气取决于神识强度，不把元婴境界本身设为无例外资格。捕获后须对应封存，取得参不等已炼成丹。
    severity: hard
  - id: void-garden-local-light
    text: 草原药地按本地空间照明呈现，不从外海昼夜推出此处日落；此标定只覆盖草原及其石山，不推广到鬼雾、黑殿或全部虚天房间。窗口用真实经过时间判定，不以明暗假替一天期限。
    severity: hard
  - id: void-gallery-selection
    text: 宝阁取物禁制通常在取得一件后挪移取宝者，禁罩快速复原；不能将打出缺口等于永久解除。实际断绝与空间能量联系的有效手段可短时延迟挪移，但须付出相应能力和耗损，不能保证无限取宝。
    severity: hard
  - id: void-relic-practice
    text: 血色披风高速与耗法并存，使用须考虑路径、转向和操控；五色铜环可护身与缚敌，实际抵挡或束缚成效依目标与对抗条件，不能因对自己试验成功就无条件控制任何人。
    severity: hard
  - id: void-cold-ding-resistance
    text: 乾蓝冰焰的极寒并非所有材料都无法抵挡；耐受的蛛丝、蚕丝或经药术辅助的火蟒仍须按实际强度与维持时间结算。提鼎寒流与吸力随进程变化，保护同行者需要真实防护能力和范围。
    severity: hard
  - id: void-spring-collection
    text: 灵眼之泉的池体、禁制、积乳和离池水分别结算。离池水灵气散去，取走积乳会减少现存量；不能只因知道凝乳原理即每日生成万年份灵乳。移动泉体须处理其与内殿的真实禁制连接。
    severity: hard
  - id: void-artifact-and-spirit-control
    text: 取得玉如意不等完全控制其独立器灵；红黄化身、银狼与器物形态共享既有主体，不重复生成灵魂或物品。实际护持、遁术与响应受施法、器物状态及器灵意愿制约。
    severity: hard
  - id: void-matched-control-practice
    text: 虚天鼎的持有、附带冰焰炼化、相配通宝诀参悟、体内培炼和实际控制权限分别成立。该鼎三层法诀要求依次为元婴中期、元婴后期、化神；第一层的有限驱使不能当作完全操控。不得挪用另一灵宝的法诀直接替代；培炼耗时须依据实际修行，不因知晓经文便瞬间完成。
    severity: hard
  - id: void-control-and-dormancy
    text: 封殿期间部分傀儡和机关关闭，不会自动解除仍在运行的禁神及塔壁空间隔绝。蛮破宝室石门不等获得其中宝物或触发取宝挪移。祭坛控阵须实际显阵、相配虚天鼎与法诀及足够法力；协同法力须有能成立的具体合力秘术和参与者配合，不能仅按人数相加。
    severity: hard
  - id: yinming-resource-process
    text: 兽晶、已储阴力、沉水、骨材、粮食和食用肉分别计量，转化须真实原料与相应操作。一完整兽晶最多按本包标定转换四十八刻阴力，旧晶消耗；日常护村每小时一刻、强力困敌二十刻另计。一次沉水试养两根矛须一罐及两小时；旧武器重浸不凭空增加新矛。可食肉须来自实际获得的可食兽体，凝兽也须记录阴气条件和形成时间。
    severity: hard
  - id: yinming-environment-boundary
    text: 阴冥之地的通常法力与神识外放受绝灵压制，真实修为、知识和身体仍在。兽晶符阵、阴力功法、短时精粹灵气等有据机制按自身条件判定，不能把一项例外扩成永久免疫。当地没有太阳升落，叙事采用阴云、雷光、作息与实际计时；外界人界的昼夜值不能制造这里的黎明。
    severity: hard
  - id: yinming-choices-and-gates
    text: 村规、粮配、晶库权力、入村和离村是社会选择，能协商、变更或违背并承担后果；不预写夺权、求婚、袭击或韩立救人。离开空间需真实裂缝、接近出口和克服吸力，暴风山不是点击即可跳出的人界传送点。
    severity: hard
  - id: yinming-identity-and-future
    text: 人界罗睺与未证身份的灵界冥河来源不能自动合并；没有鲲鹏残羽、罗睺尸体、百头虫晶核或南宫婉后来所得提前掉落。后期原作访客与当地凡人的出生、到来和死亡分别按其当下状态发生，不依章节名单刷新。
    severity: hard
  - id: yinming-material-identification
    text: 沉水用于养护骨兵，也能在接触后配合实际作用帮助从岩壁剥取万年玄玉；较大玉块消耗更多沉水，不能无限取得。材料辨认须依据实物性质，不能把所有阴寒液体视为沉水。阴冥兽晶与魂石的称名和兼容用途不增加库存；制作或修复傀儡还需相应知识、结构和材料。
    severity: hard
  - id: yinming-conditional-ghost-practice
    text: 浓郁阴气可支持适配的鬼道及人鬼合修之术；修行仍须已有传承、对应主体、实际时间与代价。阴阳轮回诀的大成后患和轮回风险保留为传承所述限制；还魂术需相应施术条件与代价，中断后的代价不会自动恢复，也不凭愿望复活任何亡者。精粹通灵气的短时例外随时间耗散，不是房屋周围的法力恢复光环。
    severity: hard
  - id: blood-civic-bounds
    text: 血鹤城登记、收费和竞技是制度，执行依知情者与能力；藏名不必自动受罚，强者也不是物理免疫契约。公平约斗、仇杀、场外伤及旁人是不同事实，不能用胜负替别人签新契约。
    severity: hard
  - id: blood-blood-technique
    text: 血道、巫道、普通修法各有条件；血液、精血、魂魄与法力不是可无限互换数量。分魂与化身有独立处境和有限已传记忆，不因称本尊即共享实时全知。
    severity: hard
  - id: blood-palace-transit
    text: 天鼎宫当前闭合，真钥匙和仿钥匙作用不同，进入还要有实际时机与可通禁制。外围可传出不保证受困中枢者自动离开；破阵、修阵与取得控制各需真实能力资源。
    severity: hard
  - id: blood-ancient-containment
    text: 尸骸、封骨玉牌、雷笼与尸变后活动体是同一事件链的不同状态；当前镇压仍在。取下疑似宝物不能既保留全部封印又得到其内部危险效应，幻泥人与冰阵化形离开支持不能变成无限库存。
    severity: hard
  - id: blood-no-later-rewards
    text: 后期马良血祭、约战鬼国、八鬼图、冰魄晋大乘与天鼎宫出世均不能因原著发生过便兑现；人物只凭当下动机、可知信息和实际条件行动。
    severity: hard
  - id: blood-reviewed-social-prohibition
    text: 血道宗门禁止血神术属于有执行者的制度；敌意和惩处取决于知情、证据、立场与实力，不会因修习动作触发世界自动处死。血骨镇宗图按共同授权记账，盗持不能等于合法授权。
    severity: hard
  - id: blood-reviewed-cultivation-observation
    text: 血蛊、再生、巫法和远距观察均须具备实际手段与条件；原文人物估计、传闻和豪言不直接变成所有修士的通用能力。分身、操纵躯体与本尊的库存、损伤、感官接收分别记录。
    severity: hard
  - id: seas-transit-rights
    text: 通行资格、机构许可、金钱与物理消耗是不同事实。牌号与邀请不能代替真实授权；有足够灵石不等于能调用他人法阵。跨洲、岛内短阵、普通道路和破界分别按具体路线条件执行。
    severity: hard
  - id: seas-federation
    text: 商盟分盟、长老会、客卿、雇员与侍役有不同职责和权力；职务不能自动支配个人财产、思想或身体。制度中的役使与不平等可由当事人服从、规避、抗争或谈判，实际结果取决于能力关系与行动。
    severity: hard
  - id: seas-true-spirit-boundary
    text: 真灵不是大乘修士一律可调用的召唤物。古契约、供奉、回应、空间承载和独立意志分别成立。真龙形体改变不复制主体；未取得的魇龙血、未来人情与未开的大会不会因章节曾发生而兑现。
    severity: hard
  - id: seas-memory-consumption
    text: 真麟留影每次完整观摩真实减少一次次数，耗尽后该载体销毁；讲述心得不能凭空再生载体或复制龙族专有仿制能力。不同生灵渡劫有差异，经验不能保证成功。
    severity: hard
  - id: seas-plant-growth
    text: 广灵道果当前未熟；未成熟、稀释汁与完整成熟果是不同状态。服果的修炼帮助不等于即刻境界提升，也不允许绕开真实功法、资源和突破条件。
      完整道果的服食资格按一生一颗记录；不能在万年体质期过后或换一棵树便重复获得完整道果的效用，稀释灵汁仍按其自身效果处理。
    severity: hard
  - id: seas-identity-temporality
    text: 胡玉双后期来到风元、田飞儿那届执事、真龙追索魇龙血、商盟对付马良、轩氏影子九灵炼成、四黑猊阵前召唤均须当下真实因果，不作为T0已成履历或定时任务。
    severity: hard
  - id: ad-seals-and-war
    text: 封印危机、边界周期、组织计划、普通族人认知是不同状态。危机可以促成行动，不会自动生成某年魔灾、强制侵界或原著胜负。修护、合作或损伤可改变后续局势。
    severity: hard
  - id: ad-material-and-power
    text: 魔石、灵石、仙灵力、魂念、寿元分别有真实来源和适用规则。普通魔石不会自动换算仙灵力；伪仙儡、残魂和各分体不因高阶称号无视剩余资源。
    severity: hard
  - id: ad-pool
    text: 洗灵池入口、魔族排斥、高阶停留压力、水压和净灵莲花期均按实际状态成立。洗髓不是自动晋升，历史成功率和传闻不能替代当前身体与功法条件。
    severity: hard
  - id: ad-desert-and-sea
    text: 幻啸沙漠强压法力并限制常规遁术，但有高耗低空缓飞的实见；海上雷电提高防护消耗而非抽象禁止全部飞行。逐段按能力、库存和实际耗时行动。
    severity: hard
  - id: ad-same-subject
    text: 元魇七滴血魂、六极本体与现有分体、涅槃本体和三化身按其同主体机制分别记录；不能因有多个躯体复制财富、共享未经传递的信息或任意增殖分体。女巡查仙残魂与原虫母元神在开篇是两个主体；古骨壳只有一具。后期吞噬、三首血肉重组和力量归并必须实际发生，不能提前共享所有力量或记忆。
    severity: hard
  - id: ad-knowledge-trade
    text: 广源斋可以查已有情报、询问调查员与有代价卜算；职业名声不保证全知。门规的保密与不涉界战是社会承诺，可被遵守或违约并引发后果，不是自动改写所有人记忆。
    severity: hard
  - id: ad-blood-rice
    text: 血牙米种源、真实兽血、培养环境和长年月共同成立；一次购买或吃一粒不会无成本生成田地、精血或无上限修为。
    severity: hard
  - id: ad-distributed-body-knowledge
    text: 各分体的力量、记忆和控制依各自功法条件。分元斩尸留下独立神智者与普通受控化身分开；旧传闻中的数量不能限制之后经实际修炼形成的可能状态。
    severity: hard
  - id: ad-town-and-ruin-access
    text: 城门、巡逻禁空、族产、阁楼、秘藏和舟船分别有实际权限与资源。地图或器物名称不是自动取得全部位置与使用知识，通行、劳务和保管须真实交接。
    severity: hard
  - id: ad-mining-and-repair
    text: 矿样、未采矿体、已经采得的原料与成品分别存在；加工、修理和守卫恢复必须消耗实际相容原料、法力与时间。公款支出与个人收入要双边一致，未完成劳动不能算已挣工钱。
    severity: hard
  - id: reported-reported-place
    text: 人物传闻、带利益的保证、亲眼观察与解释性推论各有范围；阴司界仍为未证传闻，不能由名字生成通行地图。灰色封魔间隙与真实药园残骸是两个空间，不得合并身份或相互复制资源。
    severity: hard
  - id: reported-garden-material
    text: 古药当前存量有限，采收、移植和用药分别检查；三个不可移植物种保留不同损坏机制。完整丹方、辅料、火候、实际能力和风险均须成立，不能仅凭“绛云丹”名称从园中免费取得丹药。
    severity: hard
  - id: reported-garden-transit
    text: 残骸的普通内部移动和破界进入、退出分别判定。薄弱点会移动，破界能力与相容配合有实际成本，未来人物的二十七年修行和宁州落点不是固定流程。
    severity: hard
  - id: dajin-political-enforcement
    text: 晋京禁飞禁斗、官府巡查与化神禁约都是社会规则。违反可以引来证人、追责和同阶干预，不能被写成任何人物物理上绝无可能违反。
    severity: soft
  - id: dajin-court-bargaining
    text: 处理朝廷、宗门、世家和散修关系时，分别核对资源控制、职分、约定与对方掌握的信息；凡人官位不直接决定修为，修为也不自动转移国库或宗门公产。
    severity: soft
  - id: dajin-fire-prison-access
    text: 火狱外围高温与中心红雾分别判断防护、神识和移动能力；普通凡人不能裸身长期生存，修士亦须有实际防护。采材有发现、接近、获取和运输成本，禁地名声不代替具体伤害裁定。
    severity: hard
  - id: dajin-rejuvenation-crafting
    text: 寒髓或太阳精火的持有不等于回阳水成药；炼制须确有丹方知识、可用材料、可控制火源与必要修炼工序。不能凭天魔宗身份自动获得丹方或库存。
    severity: hard
  - id: dajin-academy-knowledge-boundary
    text: 入书院或道观只赋予已经获得的身份和学习机会；不得自动知道噬真合元诀、锁心咒、炼器秘术或高层私下计划。招生资格、录取、拜师、资源分配分别按真实条件与决定进行。
    severity: hard
  - id: dajin-workshop-resources
    text: 使用地火与炼器设施须有真实通行和使用权、配方与操作知识、足量原料及实际耗时；地火之精和指定材料不能由背景文字生成库存，炼器技能不由修为自动替代。
    severity: hard
  - id: dajin-tianji-space-boundaries
    text: 固定芥子空间、储物器和可折叠天机府分别按其实际能力工作。固定空间需要已相连且完好的传送阵、供能和许可。天机府只使屋舍与同炼的桌椅等死物随之变化；活物遭空间巨压，收缩后封闭而无法吸取外界灵气，收起前须移出活物和药园灵药。收放不能复制空间、住民或资源。购买、展示、持控制令与所有权转移各自单独裁定。
    severity: hard
  - id: dajin-secret-exchange-operation
    text: 交易会的身份牌只证明有效入场资格，编号不等于在场人数；失效和撤销按当期规则。遮形须实际符箓与完好法阵，不抹消物品、行为和可追查线索。灵石竞价和以物易物均须有真实资源与权利人同意。
    severity: hard
  - id: dajin-guest-obligation-boundary
    text: 客卿挂名不自动承担全部宗门命令，也不自动得到公库所有权；报酬、一次援助、继续供奉和退出分别按实际承诺与行为处理。
    severity: hard
  - id: dajin-tianfu-lost-knowledge
    text: 三大密符的名声不等于三种完整制作知识都可取得。六丁天甲旧传已失，化灵符须结丹丹火及时间材料；古祖符需重新炼化和培炼，不因拿到物品即有原威能。
    severity: hard
  - id: dajin-kuzhu-unique-root-and-trade
    text: 天桑多干是同一根系，不生成多株独有神树；万木阵须真实阵眼、供能和完整结构。灵叶、法剑或灵禽羽翎的取得须从现存资源和权属产生，交易争议可协商或冲突，不能固定重现将来来客的比试结果。
    severity: hard
  - id: dajin-mobile-head-space-boundaries
    text: 天机总殿游离空间不同于晋京试器空间，当前出入口须实际连通、许可和禁制通行；入口移位须改变真实连通，旧地图不能永远直达。禁空是本地有例外的禁制，不是全世界高度限制。
    severity: hard
  - id: dajin-temporary-space-cost
    text: 临时芥子阵具只适合有限空间，需要大量持续灵石供能或空间灵脉，器具寿限与失效塌陷必须计入；不能将器具自动变成永不耗材、可随身携带的独立世界，也不能保证修复已崩坏裂隙。
    severity: hard
  - id: dajin-yinluo-corpse-conservation
    text: 铜甲炼尸、乌甲尸王、元神灯与生魂均须对应实际载体和主体。成王须长时炼养与材料，不能复制一具尸体成数万尸群；灯况反映实际联系，不得按原作未来章节预先熄灭。
    severity: hard
  - id: dajin-buddhist-body-shadow
    text: 明王诀层次和肉身承载必须真实达到；金刚虚影使用本人法力且受损可反噬，不能凭佛门或护法头衔无条件生成后期能力。
    severity: hard
  - id: dajin-seal-soul-conditions
    text: 封魂咒须实际施术并形成魂魄封禁；施咒知识不自动包含解除法诀，封印延迟与解咒不同。修为、魂魄、材料、法门和外物实际条件决定过程，不按未来章节预定谁中咒或必定获救。
    severity: hard
  - id: dajin-blood-thunder-conservation
    text: 血雷子需要真实污秽材料及炼制，接触适用器物才损其灵性；血雾与辟邪神雷彼此消耗，不能靠术名无限污染或无限克制。
    severity: hard
  - id: dajin-tianjue-body-condition
    text: 天绝魔尸须有实际通灵行尸载体，并处理原有神识；强度承接原尸条件和实际炼养，不凭法诀生成重复尸身或默认取代现存主体。
    severity: hard
  - id: dajin-vault-authorization
    text: 冯家密窟须找到实际入口、取得钥匙并正确供能操作；此阵按正确五个槽位供能，填满所有槽有空间撕裂风险。不得凭持有信物自动改写血缘或取得全部族产。
    severity: hard
  - id: dajin-tianji-privacy-boundary
    text: 天机屋防窥禁制可被超过其防护的手段破坏，破坏可被屋内使用者察觉；缩放、禁制及实际供能各有限制，不无条件免疫神识。
    severity: hard
  - id: dajin-buddhist-training-condition
    text: 明王诀须实际法诀、舍利等条件与修习，借煞气锻体有风险，不能只凭境界或得到书名自动学会；舍利形成不按固定境界保证。
    severity: hard
  - id: dajin-inherited-banner-control
    text: 阴罗传承幡可在取得催动法并实际炼化后被新持有人使用，不靠滴血认主锁定一生；控制器物不自动改变宗门归属、合法产权或他人的认知。修复仍需适合资源与过程。
    severity: hard
  - id: dajin-feng-asset-and-permission
    text: 冯家公库、族田、密窟和私人钱粮各有所有者；管事或持钥者的保管权限不等于私人所有权。租债须从实际库存交接支付，困难可协商，不能自动生成钱粮。未知密窟路线和五槽操作须实际获得知识，亲属关系不自动共享秘密。
    severity: hard
  - id: wanyao-banner-conservation
    text: 万妖幡的本体、灵性投影和幡内妖气显形必须关联同一来源；不能用投影复制第二件可独立出让的幡。重凝形态、空间防护和破禁结果受实际法力、储存与攻击条件约束。
    severity: hard
  - id: wanyao-treaty
    text: 车老妖真身出谷与干预凡俗受到同阶政治约定和可能的联手报复约束；这不是不可跨越的物理墙。叙事应区分威慑、承诺与实际能力，是否违约由人物处境决定。
    severity: soft
  - id: wanyao-not-monolith
    text: 万妖谷、冰海和独立妖修不是共享全部认知的统一角色。材料、私产、指挥权、敌友和临时合作须落实到真实持有人；后期攻城联盟不能自动存在。
    severity: soft
  - id: north-rare-production
    text: 玄玉洞强行击碎矿玉不是成功采得完整万年玄玉。完整取玉需要已有阴水等有证据的有效手段，消耗须记账；汇聚器在正常条件下完整十年才产一滴，不得因为经过一轮对话就增加库存。寒髓服用或炼制同样消耗真实滴数。
    severity: hard
  - id: north-bell-limits
    text: 镇海钟对低阶寒性妖兽和高阶妖兽效果不同；发动需真实掌控宝物，持续与恢复按时间记录。后期所述一炷香和百余年分别是效果时长和沉眠量级，不是所有对象必定失去行动。
    severity: hard
  - id: north-politics-and-war
    text: 小极宫与冰海、万妖谷的敌意和资源压力可导致冲突，也可因行动改变；不以千年历史模式强制刷新攻城大军，不能预先让人物知道后期空间节点发现。
    severity: soft
  - id: north-north-entry
    text: 小极宫入门、内外宫转入与定元牌发放属于可执行社会规则；核查担保、牌有效期和真实名额。蜃楼石阵偏转神念方位，不把知道冰城之名当作自动绕过禁制。
    severity: soft
  - id: north-north-council
    text: 开启虚灵殿须满足具体阵器条件与组织许可。按真实议事名册计算多数，监察异议可被留守长老三分之二以上赞同推翻；职权不能凭空生成钥匙、法力或替他人投票。
    severity: soft
  - id: north-cold-resources
    text: 冰灵果与玄冰花是不同资源，真实采集、服用和药物炼制须转移或消耗有限数量。冰果寒力须按修为功法转换，玄冰花摘离适宜玄冰后很快化水；未证实的保存法不自动有效。
    severity: hard
  - id: north-ice-treaty
    text: 旧约限制高阶妖修与人修的特定行为，并非禁止一切低阶狩猎或让违约者自动死亡；是否违约、谁得知、能否追责分别判断。
    severity: soft
  - id: north-hall-relocation-use
    text: 三殿迁移需要现存阵体、相连殿体、真实灵石与控制知识；数量和品阶不可跨库存复制，装入、取出及消耗都须记实际状态。原文一次成功不提供任意目标或任意最低耗量保证，未核定目的地不能凭名称直接穿越；迁移可能损伤秘境建筑而非免费重置。
    severity: hard
  - id: north-hall-exit-control
    text: 地下密道目前只确认进入虚灵殿，不能由存在入口推出原路自由返回。正常离殿经主殿两小阵；条件不满足时必须调查法诀/供能/目标或尝试真实破禁，后者需要时间、能力且可能失败。大型闲置古阵与日常小阵不同，不互相复制目的地或开启动作。
    severity: hard
  - id: north-bingfeng-advancement
    text: 冰凤族化神进阶不能仅凭强行提高境界数值：需满足真实积累与本族仪式条件；未行仪式即突破有长期修炼代价。临时自残秘术也需十级本体和实际道基损伤，不能当成一轮后恢复的免费增益。空间撕裂仍受当地封禁与自身法力限制。
    severity: hard
  - id: north-ancient-transfer
    text: 单向古阵需要真实对应灵宝与有效阵法响应，不因口述目的地或持有仿制品自动开启。长距传送须具备相应防护；无防护有空间撕扯风险，接收地既存禁制也继续生效。传送不复制唯一虚天鼎，亦不自动向人物泄露未知接收地。
    severity: hard
  - id: north-ghost-covenant
    text: 玄鬼令、柳与鬼母为独立对象，持令不改变鬼母的主体意愿。封禁、传念与同生咒按真实关系生效；出令借力需要条件与魂石等已证实资源，无魂石强驱存在阴气入体和病损风险。柳关于未来化神解咒的说法不自动成为必然事件，也不能凭一轮对话令魂石补满。
    severity: hard
  - id: north-jade-accounting
    text: 获取完整万年玄玉必须对应实际矿段或既有库存的减少。当前已勘定矿段每成功取一份完整玄玉至少消耗一份待采原料，所需阴水与取玉手段另按真实条件审定；失败损耗不能凭空补回。进一步勘探可发现其他矿段，但不能因玩家要求就自动生成资源。
    severity: hard
  - id: north-defense-cost
    text: 寒眼的放寒、镇宫阵全开和幻光玄天阵拘束需要真实控制与供能。放出蓄积必须减少可调度寒气；阵石和主持者法力需要扣除，不在下一轮无依据恢复。冰海寒性妖物、八级以上飞遁和超出困阵能力的目标分别判定，不能通用秒杀或永禁。
    severity: hard
  - id: north-fauna-limits
    text: 雪猿、雪吼、冰狞与寒魅为不同类型；某次见到的四五级/五六级/七级不能决定所有个体境界。驯养需要具体个体、食物、时间和能力，不能通过物种条目直接获得灵兽。雪猿独有驯法为人物猜测，寒魅耐寒不代表免疫其他伤害。
    severity: soft
  - id: north-medicine-accounting
    text: 服药必须减少所服对应药量，效果按该药、体质和毒物判定；百草丹不免去逼毒过程，火阳丹不提供永久抗寒。未知炼制配方与辅材不能靠药名直接补库。
    severity: hard
  - id: north-life-tablet-boundary
    text: 本命牌必须实际绑定人物，状态变化须由对应生命状态或牌体损坏等真实因果裁决；仅凭牌熄灭不能自动得知死因、凶手和远方库存。寄身的分念与宿主为不同主体，驱逐/杀死宿主不自动杀远方本体。
    severity: hard
  - id: kunwu-resource-accounting
    text: 阵内储能、尸气、金遁灵力和石卫载体都是实际有限存量。瞬移扣十刻阵能；金遁每次至少一刻专用灵力，其他护阵与尸术按持续时间、规模和实际代价核定并扣除。补充须有有效灵石、地火、矿物或其他已证能源和真实工时，不能靠说休息过就恢复千年积累。石卫损毁减少载体，修复消耗相应材料、阵能与工时；法阵控制者未改变时不服从陌生命令。
    severity: hard
  - id: kunwu-soul-and-body
    text: 魂源、完整心智、分身、器灵与躯体不得按称谓复制。开篇双首银狼只有一个主动融合心智；元刹本尊与分魂没有实时信息共享，分裂须真实行动改变现状。召出神念临时显化不等于跨界本体来临。五子同心魔、夜叉三尸和鬼王诸分身有固定载体或同源核心，不能以分身名义复制无限能量、财产、记忆或人口。
    severity: hard
  - id: kunwu-seals-and-transit
    text: 古困灵阵、封山、层间屏障与传送阵分别约束实际通行。T0全封禁完整，绝不按原著章节或既定日期开启昆吾。可对已知结构研究、毁坏、修复或放弃，但每步须符合现场能力、材料和代价；破某一局部不等于全部守卫与真魔封印失效。七层黑白阵分别通相应房间，黑阵二人、白阵四人的容量不可混用。
    severity: hard
  - id: kunwu-knowledge-and-custody
    text: 拥有门派职位、寿元或高修为不赋予未亲历的未来、其他人秘密和全地图。富成开篇尚无培婴丹方，木夫人未收后来来信，叶家未掌握封魔全貌，囚兽不知道外界当前状况。保管、借用、私有与族产不同；十八阴罗幡是当前实际套装，可付真实代价改变，绝非物理上永久最多十八。
    severity: hard
  - id: kunwu-weather-and-life
    text: 阴风与瘴气依周期变化，风弱时仍不保证适合入洞，探险由当事人按实际准备决定。普通家庭、师徒与宗门各有有限钱物、真实来往和可拒绝的请求。采药、修器、行医与教导可改变状态；收材料、动手、完工与收款分别发生，不因说打算做就当完成。
    severity: hard
  - id: tiannan-tree-and-dan-conservation
    text: 醇液来自真实灵眼之树周期或旧库存。转移与炼丹须扣实际滴数，不能直接饮用当成丹药。定灵丹只帮助定心安魂，不承诺元婴结果；药方、知识、灵根、修为与火候是独立条件。
    severity: hard
  - id: tiannan-not-future-alliance
    text: 天道盟、六派迁徙、魔道入侵日期、四方互援、婚约及探谷行动只在条件和人物决定形成后才能进入运行事实。旧仇与资源竞争提供动机，不能替代当期行动与消息传播。
    severity: hard
  - id: tiannan-institutional-and-individual
    text: 正魔、宗派和家族称名表示组织与传承，不预先决定每一成员的道德或对玩家的态度。抢夺、救助、结盟和拒绝均须由具体人物在认知与能力范围内行动。
    severity: soft
  - id: tiannan-tianxing-orders-and-beast-care
    text: 天星制符店的材料报价、工费、交期、失败责任须先约定并留下真实账目。尝试绘符会消耗实际符纸与丹砂，成符才增加相应库存；失败赔款从商号已有灵石支出，资金不足须协商或形成经确认的债务，不能凭空补钱。灵兽成交须交付款项、所有权和照料责任，训练需实际适应，喂养消耗饲料与时间，驯养不保证绝对服从。
    severity: hard
  - id: yue-institutions-not-fate
    text: 入门名额、门派禁令、师徒礼、燕家族务和试炼奖励是社会规则，有现实执行者与资源；可以协商或违背，不是自动强迫剧情的世界意志。
    severity: soft
  - id: yue-forbidden-not-quota
    text: 血色禁地危险取决于实际古禁、妖兽、资源竞争与行动。历史生还比例不强制杀死相同比例人物；日期到了也须有人实际开禁和组织。
    severity: soft
  - id: yue-trade-no-free-skill
    text: 买到纸笔、丹方或秘籍不自动掌握手艺；需要适用资质、法力、材料和练习，失败会消耗投入。
    severity: soft
  - id: yue-bounded-paper-and-talisman
    text: 符纸、丹砂与符宝威能都有实际余量。制符每次消耗已下笔的一张纸与一份丹砂，失败仍消耗；成符才有相应效果。小剑符宝每次有效催动扣一份现存威能，剩余为零后只余废符。
    severity: hard
  - id: yue-separate-seals
    text: 血色外层风禁、环山迷雾、第三层古禁、青石殿隔识与地下机关是不同机制。月阳宝珠只能处理其有能力影响的雾瘴，不自动打开所有门；高境界隐修若能规避入口限制也不把通常限制从世界删除。
    severity: hard
  - id: yue-guest-key-not-universal
    text: 太南谷客舍的通行符只对应自身禁制，使用后仍留有实际符纸；权限、保管和借还须以实际关系为准。通音符只传讯请求接引，不能替代接应者开阵。
    severity: hard
  - id: yue-monthly-work-not-auto-credit
    text: 黄枫谷的杂务、月赏与入门配给需要当前资格、实际履职、库存和办理；任务表中的年交或季交额是义务目标，不是种植后保证产出。功法和术法须真正学习与练习，得到书本不等已掌握全部。
    severity: hard
  - id: yue-yuelu-service-conservation
    text: 岳麓阅览、复制、传送、租室、借兽按实际授权、时间、库存和交接结算。公费匣不等值班人财产；资料原件不因复制而消失，抄本仍消耗纸材和工时。
    severity: hard
  - id: yue-herb-and-fire-conditions
    text: 筑基丹配方所需主辅药及地火或真火、耐火炉具仍需齐备。普通环境难养主药是既有经验，特殊培养条件可另行生效；服丹、炼制与吸收均耗实际时间，失败和损耗有真实原因。
    severity: hard
  - id: yue-hunger-and-eligible-skill
    text: 炼气十层以上短期辟谷和一粒辟谷丹可支撑约一月，不能凭境界无限免除食用需求。获取青元残本不补出失传层次，也不自动获得剑芒、护盾和相应熟练。
    severity: hard
  - id: yue-conditional-study
    text: 取得功法书只提供实际载明的内容，须已识字并完成阅读、理解和有条件的练习；归元灵甲消耗自身法力，幻影不形成独立生命或库存。缺失的层次和古阵图不得凭书名自动补全。
    severity: hard
  - id: yue-paired-signal
    text: 紫光感应珠的成对毁裂只证明对应器物在范围内受损，不能由此判持有人必死；灵气标记的定位须此前实际种入且仍在可感应范围。
    severity: hard
  - id: yue-political-access
    text: 皇城与门内禁入、战争征调和商家许可是由实际人物执行的社会安排，不能把一条规则直接变成强制移动、凭空罚款或命定未来。
    severity: hard
  - id: yue-blood-manual-constraints
    text: 煞妖诀、血凝五行丹和煞丹术须有对应法门/真实材料及实际修炼，伪丹不等正常金丹；法门所载成功机会不能作无条件保证，停进和长期神智迟钝代价不能漏去。血灵钻必须久炼压元并承担痛苦，释放后原有凝练消耗；修髓丹只有相应炼者适用，他人不可通服。
    severity: hard
  - id: yue-body-blood-tracking
    text: 以特定身体精血炼成的引魂钟只对对应躯壳发挥感应或控制；超过有效距离、被相应手段隔绝时不能定位，不直接追踪一切魂魄。躯壳与其中元神、旧主人意识是不同对象。
    severity: hard
  - id: yue-blood-tower-access
    text: 金箱内的令牌与中心巨塔对应，获得令牌不等已到塔内或具有元婴后期；外部压制与塔门古禁分别成立。塔中六丁天甲符吸附近实际天地灵气，不能在气源被隔绝时凭符名产无限灵力，启停、损坏与转交均作用同一张实物。
    severity: hard
  - id: boundless-no-free-crossing
    text: 地理父级不提供传送。无边海航行、潜水、探阵须连续路径、实际定位、防护和有限补给。关于远航失败的传闻不能裁成永远无法过海的定律。
    severity: hard
  - id: boundless-seal-causality
    text: 七处海下阵基的浮现、魔气外泄及海水净化，必须由实际封印状态和后续作用引起；不得按章节时间自动发生。移走阵眼或长期损坏封禁要保留真实后果。
    severity: hard
  - id: boundless-private-history
    text: 秘阁旧卷和海底矿物均须真实接近、查阅或探测才能得知。太真门的古代职责不能作为全体门人先验知识，地名也不自动授予秘密位置。
    severity: hard
  - id: dv-soul-and-body
    text: 血焰主魂、独立分魂与唯一原躯分别存在。附体、夺舍、合魂和解体化形必须发生真实状态变化与成本；不在开篇预置南陇死亡、分魂夺躯、两魂和解或魔劫结果。
    severity: hard
  - id: dv-seal-and-illusion
    text: 供桌的延寿药、补天芝、金雷竹是幻象；真实可移物仅按实体与库存。拿走镇物会削弱封印，不能同时把镇物收走又保持原封强度；封钵魂不得忽略仍在的镇压。
    severity: hard
  - id: dv-ancient-route
    text: 古图、名号、稳定年和一次安全行进都不保证现路安全。谷口、血禁、元光、古兽、灰隙破界、药园对应分别校验；普通内部山路不套用跨界珠消耗。
    severity: hard
  - id: dv-dayan-limit
    text: 寄神傀儡使大衍保持神识和研究，不恢复肉身法力、不自动控制封室守卫、不无限延寿。后期韩立与大衍的交易及终极傀儡必须从真实相遇、材料与研究重新发生。
    severity: hard
  - id: dv-fruit-and-remains
    text: 活兽内丹不能同时作为战利品；古兽不灭之体有条件和代价。灵烛果、古丹、有限火灵料与北极元晶的采收、辨识、加工分别消耗真实物件，不由角色自述复制。
    severity: hard
  - id: dv-reputation-is-not-fate
    text: 坠魔谷的凶名、无人能归的概括、寻宝者自称的把握与必有重宝的诱劝，不是客观成功率或强制结局。实际风险按裂缝、禁制、古兽和行动条件结算。两仪阴环是避北极元光的一种手段；有据的其他宝物或多人防护阵也可尝试，但须拥有实际知识、装备与力量。
    severity: hard
  - id: dv-miasma-and-navigation
    text: 万岭山脉山腹长期浓瘴剧毒且遮蔽辨向，外围较稀薄；当前程度取实际miasma-phase。抵御毒性不自动解决迷路，也不等于能在浓瘴中采药。退瘴期与谷口相对稳定期同步；谷口仍须探测或避让真实裂缝，不因稳定就安全。观察当前相位不自动获知完整未来周期。
    severity: hard
  - id: far-seas-route-evidence
    text: 五龙海、乱星海与天沙大陆是不同地理对象。知道地名不等于知道航线、传送阵坐标、阵具权限或空间节点入口；远行须具备实际路线、承载能力、资源与风险条件。后来的节点封印、值守和来客不会自动成为当前设施。
    severity: hard
  - id: immortal-external-boundary
    text: 仙界不开放探索；外部历史与势力索引不自动成为可访问地点、公共人物知识、现成传送门或召唤权限。九元观后来追捕、马良降界与血祭不得按小说章节或固定日期强制发生。
    severity: hard
  - id: immortal-conditional-crossing
    text: 界面失联不等于一切特殊跨界物理不可能；常规降界和跨界通讯需要真实目标、权限、媒介、资源和能力。特殊宝符或法器只具有已证作用，不能用口头仙人身份无耗跨界。
    severity: hard
  - id: immortal-text-and-technique-learning
    text: 银蝌文、金篆文与所记功法的学习分别发生；看见文字或持有残页不等于已能参悟、炼制或施展。修炼和仙家工艺仍须满足实际肉身神念、材料、法力和时间条件。
    severity: hard
  - id: immortal-bounded-institutional-knowledge
    text: 仙界禁令属于机构规约，其执行者有感知、管辖和行动范围。角色的传闻、威胁、报价、库存声明和成功率估计不能直接写成客观世界事实；新证据可以改变认识。
    severity: hard
  - id: steppe-same-land-no-foreordained-war
    text: 慕兰／天澜为同一草原的两种称呼；开篇北慕兰、南突兀。后续会战、全境易主、法士南迁、阴罗宗参战均取决于人物行动和条件，不按章节或固定百年计时器强制兑现。
    severity: hard
  - id: steppe-lingshu-learning
    text: 法士、仙师是地域称谓，灵根、境界和资源约束沿用共同规则；慕兰灵术重五行配合，要有实际已学术式、施法者、法力和阵位。民族标签不自动提供全部术法，也不自动战胜同阶。
    severity: hard
  - id: steppe-temple-rule
    text: 开灵是天澜圣殿的授业与资格制度，揭示/使用已经存在的修炼资质；未开灵私授受机构禁止，可由人选择违反并承担反应，不是客观上无法学习。开灵窗口不自动征收贡品、不自动收徒，也不造灵根。
    severity: hard
  - id: steppe-ritual-distinction
    text: 元明灯召慕兰圣禽是借宝物显投影力量；灯影不复制古灯本体。天澜分神重铸灵身是另一机制，不能把两者相互替代。上界本体、降临投影和新灵身分别识别；任何新降临须有真实媒介、施术能力、耗材与因果，不预置小说后期分身。
    severity: hard
  - id: steppe-lamp-consumption
    text: 当前元明灯每一份旧灯油最多维持600秒，是耗用上限而非召请必成概率。当前乌稷会保养与青焰护身；解读封存召请式并验证能力之前，无人因持灯就获完整召兽术。点灯消耗真实灯油，灭灯或油尽终止依赖灯火的投影维持。
    severity: hard
  - id: steppe-commons-and-contracts
    text: 部落公库由掌事人保管而非个人所有。草约和供奉提议没有签定就不产生既成债务；签定后应登记当事者、内容、期限和真实交付。石苓有灵根不使石岚或圣殿自动拥有其终身劳务。
    severity: hard
  - id: steppe-travel-and-language
    text: 草原父节点不能缩短跨区路线；骑乘、遁行、行舟耗时取决于实际距离、能力和补给。语言需要已学知识或翻译；知道地名不会获得当地秘仪、他人动机或路线上的全部消息。
    severity: hard
  - id: steppe-arts-and-limited-hide
    text: 灵术须本人学会并有实际法力、配合与条件；红尘万丈会妨碍探测但不是绝对全知屏障，单人术不能凭名称扩成数十里联军阵。须弥虫幼虫的空间藏形有大小和时长限制、可能被识破，不能将它当永久无代价异界仓库。
    severity: hard
  - id: steppe-cooperative-array-inputs
    text: 多人灵术大阵可由法士承担阵器位置，但须真实参与、主持、相应术法能力和法力；不能仅宣称结阵就生成无数参与者或施放器物。协作人数、当前消耗与受击中断应依实际局势判定。
    severity: hard
  - id: steppe-ritual-and-animal-care
    text: 圣殿分神降临须真实已有器物、会法操作者、法力和适当媒介，并满足跨界条件；物种图像或普通典礼不能替代。灵兽进食、毒液和受伤处理按实际主体与数量变化，不因主人有命令就忽略距离、状态与防御。
    severity: hard
  - id: xlt-crossing
    text: 小灵天是独立空间。位置父子关系、地图名称和听闻过入口都不能替代实际已打开的通道；古坛只测算，前置材料、学习、时机与精度逐项核对。
    severity: hard
  - id: xlt-incarnation
    text: 绿灵寄附改变同一承印者的形态和能力，持续抽取木灵及法力，耗尽、失联、受创会影响维持；本体、元神和随身物不复制。雷术克制按实际强弱和施法判定，不保证一击必杀。
    severity: hard
  - id: xlt-boundaries
    text: 当地种族和地理可持续存在，人物和组织可以合作、迁移或冲突。没有必然的韩立来访、三长老陨落、罗睺遗骸、百余人移民与异族降服；这些结果只有实际因果成立才会出现。
    severity: hard
  - id: xlt-forest-custody
    text: 罡木树体、林木木灵、断枝库存和协议是不同状态。取材须改变相应库存与树势，保管不自动赋予出售整树之权；传闻的独一性不替代实地鉴定。
    severity: hard
  - id: xlt-learning
    text: 修为、族属和知道技艺名称不等于掌握该法。原著未来的母女传法、南宫驻留和韩立赠丹不能成为开篇任何人的既有记忆；个体突破仍以实际条件判定。
    severity: hard
  - id: completion-cultivator-standing
    text: 筑基是重要修炼与社会身份分界，早期“正式涉足修仙界”不能阻止炼气修士进入坊市或门派。境界排辈、能者为尊是社会惯例；称前辈、师叔不改变真实师承亲属或产生控制权。正邪评述与实力威慑须保留说话者和场景，不使所有正派必伪善或高阶必杀低阶。
    severity: soft
  - id: completion-local-society
    text: 散修、家族与仙派是身份或组织类别，不能由泛称生成统一势力。部分低阶避世苦修、供奉凡豪被轻视与宗门附近城镇仍有低阶往来并存。资源支持有益而不保证结丹，散修不必贫穷或终不能进阶。双修依双方实际法门、修为和意愿，女修处境、侍妾风险与人物求依附的想法不是强制婚配或性别决定修为的法则。功法隐私、灵茶灵酒偏好为社会习惯，允许个人选择。
    severity: soft
  - id: completion-sustained-talisman-cost
    text: 持续存在并受使用者控制的符术通过灵力联系维持，即使初次激发后仍可能持续耗法。炼气修士通常难察这条微弱灵线，知情须实际学习或体验；水罩、风墙等的持续负担不能漏记。瞬时已结束的符术不能无限持续扣费，控制、持续效果与施法者法力按实际条件处理。
    severity: hard
  - id: completion-basic-spell-functions
    text: 天眼须施展才能感灵，境界差大且对视时可能扰乱心神，不等读心或人人自动精通。通常炼气敛气、筑基引气与萧祖孙无名敛息法各有不同遮蔽条件，不把名称相近的法门合并。定神符对凡人可僵身失语，对有法力的低修可能仍留言语表情；风缚亦有时限与抗力。驱物、数弹瞬发、轻身须学练，罗烟步则为凡俗武技，幻影非实体分身。石化术以已有泥土构造为对象；化剑为丝不保证破万法。隔音、土遁、金遁、雷遁各受实际术器、环境与对抗制约；转颜只改外观不改年龄寿元。具体风刃速度比较不作全属性固定倍率。
    severity: hard
  - id: completion-corpse-soul-and-curse
    text: 墨、余旧事中的噬魂临时法力与加速衰老须保损己代价，不能变成永久修为提升；铁甲尸与低等尸人不是同一制炼程度，需材料秘法，不由类别名生成尸体。炼魂抽魂折磨、威慑叛徒的声名不证明每人会此术或受术者必如实服从。附灵向低智妖兽形成半妖合体且代价重；远距附身借体只发挥部分实力，两者不可互换条件与后患。
    severity: hard
  - id: completion-ordinary-craft-practice
    text: 丹方收藏与失传说法限定地点、时代和知情者，不能清空两界已有配方。炼丹与制符须实践和真材料，普通师傅二三十年培养是经验概数，不是固定到期升级或多失败必成功。法器等级、昂贵符耗及灵宝稀缺影响选择，不构成所有人必贪或每次宝物出世必发战争；局部物价不能锁成全界永久价目。
    severity: soft
  - id: completion-beast-stage-comparison
    text: 墨蛟早文进化阶称须与通常妖兽等级区分，二阶堪比筑基后期与三阶结蛟丹是该类情境，不覆盖全部二级妖兽。脂阳鸟火生食阴魂、画轴仅分魂按典籍与实物分别；所知已绝迹不宣判两界绝无任何存续。啼魂祭炼与克鬼解释为紫灵当时所知，不赋无限克制或让她知道后来的本源。十绝毒的致命声名是具体毒、接触与防护条件下的风险，不凭名称杀死所有境界。
    severity: hard
  - id: completion-arrays-and-portability
    text: 颠倒五行阵以遮掩、迷惑困敌为长，原有禁法不靠主动杀敌。可携阵旗阵盘便于布置，但普通便携阵具不自动等同完整护派大阵，多套仍需实物、灵石、布局和维护。齐辛后来研制、改进和韩交易所得不提前给开篇任何人。
    severity: hard
  - id: completion-memory-alteration
    text: 玄阴经梦引术可封存、篡改特定记忆，需要双方实力相差大，否则可能损害受术者神识。它与无忧针、忘尘丹和普通控神分开；知有术名、持有典籍、实际学会并成功施用是不同状态，修改一个人的记忆不修改客观历史或其他人的认知。
    severity: hard
  - id: source-conditional-natural-conversion
    text: 依赖环境条件的物质转化须核对真实器物、输入、有效经历时长与容量；以物的已记条件及进度产生并更新有限数量。时间经过本身不能跳过遮蔽、天气、材料或容量。分装、稀释不复制有效物质，耗散与使用都应扣减相应数量并记录发生时间。秘密作用条件不因其客观存在而自动成为人物知识。
    severity: hard
  - id: global-detail-mortal-herb-supply
    text: 常用凡俗药材可培育，珍稀高龄草药通常更难获得，野采需真实地理与风险；世家长期种植、收购不使所有世家自动拥有百年药。黄龙草、苦莲花、忘忧果、三乌草属于可辨药草，药性与年龄须依据具体植株；名称、配方或传闻不生成植株、年限和库存。
    severity: hard
  - id: global-detail-remedy-treatment-limits
    text: 黄龙丹、金髓丸须服炼才可能助益适合的低阶功力，不直接授予境界；药力跟不上境界与长期服用失效分别判断。清灵散能解多种毒却不是万能解药，尸虫不因服此药便自动消失。养精丹可显著缓和内外伤、止血与促进恢复，但不能起死回生；具体伤势、药量和病因仍需判断。
    severity: hard
  - id: global-detail-mixed-poison-response
    text: 缠香丝须实际配制并入体，初期妄运内家真气会促毒；久留入骨可造成严重萎缩并需对症药持续抑制。可替材料使毒性与解药不同，不能仅会一张通方便自动解另一制法。本文凡俗难解不排除后续确有依据的高阶救治；中毒威胁不强改人的意志。土菇花有毒且能妨碍普通离体元神施术，实际强弱、剂量与防护须核，不保证对一切境界神魂必杀。
    severity: hard
  - id: global-detail-seven-ghost-expenditure
    text: 施七鬼噬魂大法需要真实备妥相应银刃和仪式条件，以施者身体及精元供养，暂获法力与简单法术能力；不永久返龄、不凭宣言补满精元。能否重施受剩余生命精元与伤势制约。具体七刃必须在世界有实物来源，知道术名不生成器具。
    severity: hard
  - id: global-detail-basic-fire-conditions
    text: 已学火弹术者需实际施法凝成小火球并用法力推动；可产生熔伤普通精钢的高温，落水不必自然熄灭，但不能由此保证破一切水系禁术或护盾。范围、控制、修为和剩余法力影响结果，持球近战也必须实际控制且承担距离风险。
    severity: hard
  - id: global-detail-basic-wind-conditions
    text: 已学御风诀者将辅助术施于自身，以持续微量法力支持加速奔行，并代替这段奔行的常规体力负担；法力耗尽或停止施法即失加速。此诀不能直接加持另一人，也不能跳过路径、障碍或移动时间。
    severity: hard
  - id: global-detail-control-spell-qualification
    text: 旧入门控物/驱物口诀要求相配的可驱对象及有效施法；普通家具刀剑和各种法器不能仅凭同一口诀自动驱使。新获得器物需要辨认并掌握对应驱法；此初学限制不构成禁止一切高阶搬运、御物或神通的普遍铁律。
    severity: hard
  - id: global-detail-letter-reagent-use
    text: 四种现形粉须实际从各自容器取出，用真实水混合，再涂相应暗信并烘干；已消耗的粉不能再次使用，需有配方材料才能补制。只持戒/知信号不自动读出消息，更不能得到寄信者此后的真实状态。
    severity: hard
  - id: global-detail-mortal-drug-and-charm-resistance
    text: 凡俗魅惑与迷药依施术、吸入或摄入、剂量、体质、精神力和防护实际生效，不因名称或威吓就强制服从、倒地或死亡。千人醉可暂致乏力与内家真气失灵，确有预防手段；笑魂散有致死毒性但不能把对凡人的实例扩成无视一切修士防护。黄栗丸是鸟食药、萦香丸用于香与避蚊，均须有真实来源与有限用量。
    severity: hard
  - id: global-detail-bell-delegated-use
    text: 引魂钟在已确立血主并连结那具炼尸时，可由持钟者受托驱使；交付保管不自动改变血主。原血主仍活着时旁人不能只在钟上做手脚便夺得控制；作用仍受距离、遮蔽与真实器具状态限制。这项特殊方法不概括所有法宝，也不能据此把活人当炼尸控制。
    severity: hard
  - id: global-detail-talisman-type-and-charge
    text: 金刚符为金属性初级中阶防御符；飞天符为风属性初级上阶飞行符，灵力未散时可再次使用，耗尽不得凭名字自动续航。实际施符仍需会对应方法，防御和逃离不保证成功。基础地刺术属初级中阶，残本、完整五行咒书等是不同传本，持有一本不等掌握全部法术。具体摊位标价不成为全界永久价目。
    severity: hard
  - id: global-detail-raw-drug-and-material-limits
    text: 药材、虫卵、鳞片的药用或炼器用途不等已制成成品；年限、品相、配方、技艺和有限材料均须实际满足。大量生吞灵药可留下杂质，不能将临时救急当作长期无代价修炼；清灵散仅按对应药患起效，药名或书名不使读者立即掌握全部方法。
    severity: hard
  - id: global-detail-device-effect-boundary
    text: 融灵符的协作需两名对象各自实际施用；控制、束缚、侵蚀和防护类器符均按目标、防护与能量对抗，单次成功或过往低阶战绩不等绝对克制。踏云靴等增速器与身法可协同，但体力和灵力负担也须兑现；速度残影不能作为真正分身或空间瞬移。
    severity: hard
  - id: global-detail-fauna-and-herb-observation
    text: 已知妖兽习性须限定物种与阶段：石肤不护一切利器，耐火背甲不等腹部无弱点，温顺不等被攻击仍不反抗，探查彩蛾会受寒死亡。紫猴花未熟不可当成熟药材，连根移植需保根与合适生境；知道此规律不等知道所有植株位置或当前年限。
    severity: hard
  - id: global-detail-craft-input-failure-and-range
    text: 炼丹、炼器、制符和造傀儡均消耗真实材料、能量与时间，所需技能和热源不因有配方自动取得；失败残料不得仍作原完好材料。玉盒只按材质/禁制保灵，不能无限保存任意物。傀儡的射程、感知和响应迟滞依具体制作与操纵者能力，不从一个低阶实例推全类上限。
    severity: hard
  - id: global-detail-special-curses-and-artifact-charges
    text: 血咒追踪、魂器约束和煞妖变均须实际施术、媒介、对象及相应代价；普通承诺不是自动受魂器控制。符宝幻化的尺影等仍来自同一有限威能，不可把每个影子当独立宝物库存。定神/迷魂依目标心神和寄魂状况判定，不保证遇到相似外貌就必定有效。
    severity: hard
  - id: global-detail-blood-spell-payment
    text: 血灵钻等血法必须支付真实精血、灵力及所操控鬼物的代价；凝结或重组不能凭空制造独立无限生魂。血遁速度随具体修为、施法与对手器具而变，声称排名不保证追上任何飞舟。
    severity: hard
  - id: global-detail-replenishment-and-transmission-energy
    text: 轮回真诀恢复的是施法者已损真元，不能从“吸补”推导基础修为无上限增长或凡人获灵根。远程古阵需足够灵石能量、真实可用两端和必要防护；低阶石耗空是消耗，不可仍作为充满能量的库存继续使用。
    severity: hard
  - id: global-detail-market-map-and-recipe-limits
    text: 地方市期是交易惯例，必须由实际商户货品形成市场；海图只记录作者已知情况，可以更新也可过时。药名、稀有程度与交易者承诺不等对任意伤病有效；炼器配方中的深海玄晶等材料不能用同名地点、普通晶石或空承诺替代。
    severity: hard
  - id: global-detail-growth-is-species-and-stage-bound
    text: 小瓶绿液催灵植仍受该物种与阶段上限；达到万年阶段的养魂木和天雷竹不能再自动提高年限。噬金虫对霓裳草的繁殖反应随金银/三色阶段变化，不将幼体经验直接移给成熟体，也不能凭资料中的进阶名字跳过真实培育条件。
    severity: hard
  - id: global-detail-attached-soul-and-false-remedy
    text: 附灵法仅按该法适用的低智妖兽施行，不能凭此强行占据其他修士；长期反复附着可能改变意识、缩短存续，不能任意无损拆分回原态。药草外观与传闻不足以证明真伪和疗效，采摘、服用须依真实对象与是否混毒判定。
    severity: hard
  - id: global-detail-ironfire-ant-environment
    text: 铁火蚁须适宜炙热环境与食源；迁出后衰弱，常规御兽认主会使其自爆，不能把捕获等同可控。其他有特殊方法的主张需独立证据，不由名称相似推广。嗅觉、速度与战力分别判定，不能因红狸善嗅就赋予同级杀伤或全知追踪。
    severity: hard
  - id: global-detail-guard-and-frenzy-cost
    text: 古殿守卫、天罡罩与寒焰防护需按对应设施、法力和方法对抗，不因人物称某境才能过就锁死所有其它路径。狂暴术临时增强有时限及后患，不能无限持续；借兽仍需原主授权、动物实际体力与可能损伤。
    severity: hard
  - id: global-detail-beast-healing-and-crafting-cost
    text: 高阶妖兽自愈仍消耗自身能力，特定要害损毁可致命，不能由个体复原推全物种不灭。炼风雷翅等器具需要合适材料、真实火源、阵法与持续法力；防护或神雷封裹只按其实际抵抗范围，不自动解除体内所有异种力量，也不把同一封裹物复制为多件。
    severity: hard
  - id: global-detail-flight-and-recovery-boundaries-rule
    text: 遁法与隐匿均有施展条件、实际代价和反制；不得将逃离一次、假死或虚化当绝对免发现。血影遁耗精血，不能在恢复不足时连续无损使用；解除封印不等治愈原本煞气。
    severity: hard
  - id: global-detail-yinming-gear-and-old-talisman-rule
    text: 降灵符的传授资格是门规，实际炼制仍须方法、相应精魄及辅材；掌门职位不能自动生成符箓。火焰石等护阴风器具只按实物能力抵抗，不能免除全部地形和寒毒危险。
    severity: hard
  - id: global-detail-corpse-fox-and-confined-sound-rule
    text: 封印会耗能，镇压不等消灭。诱兽和困兽须实际对象与匹配器具；幻术、附体、变化与正常妖兽化形分别判断。密室音波可受环境加强，不能把当次增幅复制到任何音攻。
    severity: hard
  - id: global-detail-tree-and-mental-technique-limits-rule
    text: 心魔的主观历时不直接推进外界时钟；定魂丹木只辅助对应风险。分魂化身可以形成不同经历和意志，不能免费无限复制主体。读取、封闭或诱导记忆必须具备实际术法条件并承担相应损害，不从一句询问获得客观全知。
    severity: hard
  - id: global-detail-thunder-bead-and-corpse-traditions-rule
    text: 一次性雷珠用后即消耗；炼制须所需雷力、阴火、材料和技艺。傀儡躯壳与寄附元神的寿命分别结算，坚固耐久不能代替元神滋养。专门收雷器具不能以普通空瓶无条件替代。
    severity: hard
  - id: global-detail-valley-material-and-tradition-limits-rule
    text: 材料、毒物和虫的评价须保留种类、适用目标及见闻范围；历史榜单不是客观永久力量总表。古宝灵料需真实形成条件，知名称不等已掌握炼制，更不能把稀缺或失传传闻当作永不存在。
    severity: hard
  - id: global-detail-tomb-corpse-and-oath-boundaries-rule
    text: 尸道与墓中阴气、魂体依附有关，欲解除依附须实际修成对应法门，不能把计划视为成功。当地正午阴气变化只影响有相应依赖的法门。索要丹药不等取得丹药；誓言须按真正术法或承诺条件裁定。
    severity: hard
  - id: global-detail-academy-bell-and-resource-conditions-rule
    text: 寺钟提神不等治疗任意心魔。门内礼法、学习任务与公用器具权限是机构制度，可由实际负责者依事实执行，不能因入门自动占有全部法器地火或获得无限报酬。
    severity: hard
  - id: global-detail-feather-and-beast-language-rule
    text: 本命羽鳞取用计及原主精元损失，不可无限无损采集。禽语理解可来自明确天赋或已学本领；法器召唤和灵兽认主仍需真实施法、权限和对象，不以境界自动授予全部动物语言。
    severity: hard
  - id: global-detail-exchange-material-properties-rule
    text: 特殊果材的生长、处理与服用条件不能跳过；拍卖价不固定为世界恒价，卖者介绍也不是疗效担保。眩光等感官伤害按对象防护与技能判定。
    severity: hard
  - id: global-detail-late-craft-and-pill-calibration-rule
    text: 防御须区分灵力攻击与实物冲击，预估威力不能代替实测。丹药效力随阶段变化，高阶法器、傀儡和火焰仍受真实材料、法力、神识与炼制时间限制；不能以吸收血肉之说即时无限升级。
    severity: hard
  - id: global-detail-northern-fight-and-method-boundaries-rule
    text: 灵目、音攻、护幕和禁法按双方真实能力及相性裁定；个体在某禁制中不受限不等无视所有禁制。五魔的重聚、合分须沿同一组主体及其实际束缚，不能复制为额外独立魔物。
    severity: hard
  - id: global-detail-spirit-material-and-heavenly-draft-rule
    text: 含法则的残材仍须匹配配方、辅材和实际炼制；榜次与称名不自动授予力量。肉躯、元神和法器灵性损伤分开结算，毁其中一者不自动证明全部主体已亡。
    severity: hard
  - id: global-detail-emperor-fluid-and-late-beast-limits-rule
    text: 帝流浆须控制单次吸纳量并遵守存放时限，不能把短暂保存写成无限库存。化界珠可重复使用不等无条件通过节点，其威力与一次性化界石不同；木生珠一次恢复须实际消耗珠。
    severity: hard
  - id: global-detail-evil-tool-and-reusable-pearl-limits-rule
    text: 重复用器或有高境界都不能免除实际能量、魂材、体力与寿元代价。一次性爆器引爆即消耗；威力估量不保证固定杀死任何目标。禁止把普通空间袋当作无条件存活体设施。
    severity: hard
  - id: global-detail-yinyang-fire-environment-rule
    text: 火灵的热寒、灵智和炼化状态分别判断；熔岩可助太阳精火而使太阴需额外抵热。控制和吞噬需要实际力量与时间，不以火名自动免疫所有攻击或复制被吞火灵。
    severity: hard
  - id: global-detail-xuantian-plant-and-script-boundaries-rule
    text: 玄天之物与金阙银蝌文字均需真实对象、知识和修炼制作条件。古记的稀少估计不等世界硬数量上限；拥有载文或种子不能直接取得全文理解、成熟宝物与无限材料。
    severity: hard
  - id: global-detail-spirit-caravan-and-skill-boundaries-rule
    text: 灵具操用仍受体力、技能与可用灵石限制，无灵根不因此长出法力。疗法按适应伤患、剂量和代价实施；商业护送、医治和学习都需实际人员和物资。
    severity: hard
  - id: global-detail-fu-needle-tradition-rule
    text: 针刺疗法须实际技艺、针具与适用伤情；有限恢复活动不等伤势痊愈。家族有传承不等每名成员或破门者掌握全套，未经教学也不能凭观察一针学会全部秘术。
    severity: hard
  - id: global-detail-spirit-beast-variation-boundaries-rule
    text: 兽群行为和变异需真实种群、环境或控制原因；不能凭兽名套统一境界或无限补兵。灵具和炼体对妖兽的有效性依具体层次、防护和成本，不由无灵根身份预判必败或必胜。
    severity: hard
  - id: global-detail-jinyu-pond-and-token-rule
    text: 九玄明玉潭的助炼体效益按已使用历史只发一次，再浸不得重置；入潭仍需真实许可。金玉灵心佩对同一弟子的精魂建立配对定位，毁佩会伤其心神，不赋予保管人控制其情感或替他同意行动的权力。
    severity: hard
  - id: global-detail-sunset-entry-and-ancient-giant-rule
    text: 边界通行须面对真实门禁、环境与守卫，不按剧情强制放行或遇战。沉睡古巨人的身体、眼窝与所生环境属于同一实体，身体再生和醒转仍须真实状态与代价，不能复制为多个巨人。
    severity: hard
  - id: global-detail-sunset-material-and-mind-pill-rule
    text: 临时增神识药不能等同永久突破或治疗无关奇毒；材料价值随用途变化，变异不必更好。驱动灵具须扣实际晶石能量，耗空后换装真实晶石。
    severity: hard
  - id: global-detail-spirit-blood-and-artifact-life-rule
    text: 生命、器灵、精血与器物载体分开结算；点灵和造血体必须扣实际材料和本源。毁掉器灵不能自动抹掉仍在的器物，器物保存也不能自动复活已灭心智。
      幻焰蛾千蛾搜寻须扣相应精元，分身不当独立可永久保存的生物库存。
    severity: hard
  - id: global-detail-tianyuan-duel-tool-limits-rule
    text: 拘魂法器的主魂、附魂和载体是不同损失项目；损一不能自动判全部魂灭，也不能凭修补声明生魂。争地斗法的装备消耗、承伤和认输依真实条件执行。
    severity: hard
  - id: global-detail-swamp-beast-and-puppet-boundaries-rule
    text: 傀儡、伪装兽与幻术须辨认具体载体；批量驱使受操纵神识、能量与真实数量限制，损毁不能由改换称呼复原。
    severity: hard
  - id: global-detail-tianyuan-treasure-and-auction-boundaries-rule
    text: 发现、主张所有权、成交与交付分开记账；拍卖广告与估价不保证效果或制造实物。旧址探查要实际进入与解禁，知宝名不等知所有藏点。
    severity: hard
  - id: global-detail-tianyuan-patrol-equipment-boundaries-rule
    text: 巡逻器具只提供实际探测与传递所得；信息可受遮蔽、距离、敌术与设备损坏影响。警报不是全知鉴定，传讯成功才形成收件者对应认知。
    severity: hard
  - id: global-detail-spiritwood-and-fruit-trade-rule
    text: 可留种的药果仍须种子、生境、催育资源和配方辅料，果实不等已成丹。碧灵木的轻质与防护按年限处理，不能把材料本身变为完整飞舟；灵舟以实际灵石供能。
    severity: hard
  - id: global-detail-spirit-mission-tools-and-blood-rule
    text: 血脉化形、元神和本命妖丹不可当可无损替换的普通装备；离体、爆毁和炼化须按实际代价处理。现场共处与战利品持有不是未经查证的杀人定论。
    severity: hard
  - id: global-detail-true-toad-lake-and-beast-boundaries-rule
    text: 山体磁力、地下水路和强兽领地是实际行路条件，不能由地图名称跳过。取兽血须面对目标存续与反抗，药方需求不自动生成血液；临时搭建据点不冒充旧常设设施。
    severity: hard
  - id: global-detail-coastal-ecology-and-soul-transfer-rule
    text: 兽类分类是有限经验，不抹个体灵智与交往可能。寄魂与迁体须实际载体、法术条件和对应意识，旧壳、新壳、魂体不能同时算同一完整主体。
    severity: hard
  - id: global-detail-feiling-market-and-thunder-contract-rule
    text: 无限供货广告不生成无限库存或自动履约；天罗丹增加其他药性有概率且不保证。市场地图与介绍只含知情者所得，买卖资格不能替代族内秘密传承权限。
    severity: hard
  - id: global-detail-twelve-transformations-and-script-rule
    text: 变身、译读和祭雷须实际掌握对应篇章、真血与修炼条件；单一原料或残页不授完整体系。品质瑕疵、卖者说法和交付真伪应保留，不凭交易名目抹平。
    severity: hard
  - id: global-detail-feiling-trial-tools-and-beast-boundaries-rule
    text: 试炼竞争允许结盟、回避、救助与拒绝；不要用社会风气强制每个主体作同一决定。傀儡结构与幻影按实际本体计数，消耗材料与被毁载体不能凭重复显像重新生成。
    severity: hard
  - id: global-detail-minghe-guard-and-water-limits-rule
    text: 守卫、傀儡、符箓、神乳与灵木本源都按实际存量和恢复条件运行。首次效益与重复效益分开记账；护甲显像不等新主体，破术须真正相克的技能与能量，不借名字相似替代。
    severity: hard
  - id: root-detail-yin-risk
    text: 浓重阴气对无相应防护者有侵蚀风险，实际伤害依强度、时间、法体与防护，不由阴气之名单独决定生死。
    severity: hard
  - id: root-detail-soul-evidence
    text: 命灯、肉身、元神与分魂存续是不同证据，灯灭不必证明本体已死。神识攻击需真实神念，并受目标防护和强弱影响。
    severity: hard
  - id: root-detail-information-controls
    text: 受禁典籍可公开简介而封存全文，强窥可能触动告警或损毁；隔音探察法阵依真实布置和范围。知术名不等掌握完整法门。
    severity: hard
  - id: root-detail-species-testimony
    text: 种族、古兽或真灵间战力比较须限定成长阶段、个体与说话者；血统和声誉不能替代当前实有能力，敌意也不强制每个成员见面交战。
    severity: hard
  - id: root-detail-beast-form-comparison
    text: 真灵变化须已取得并炼化对应真血及实际修习。少量真血不等完整本体，环境相克仍需实际强度和作用条件。
    severity: hard
  - id: root-detail-insect-variation
    text: 变异个体的拟石、潜土等能力不赋给整个物种；培养耗用真实生灵和材料，拟石虫不能同时另算可开采矿物。
    severity: hard
  - id: root-detail-trueblood-extraction
    text: 真血取得与炼化要考虑种属、纯度、量、修为和承受能力。抽血伤害及消耗真实发生，普通兽血不等完整真灵真血。
    severity: hard
  - id: root-detail-combined-instruments
    text: 合用套器须各件真实存在、供能及操作者配合。定位盘只指向实际标记，可被干扰；器物幻化巨影不另成永久生灵。
    severity: hard
  - id: root-detail-observation-instruments
    text: 映影晶等探察依已布置节点、范围和信息通路，禁制或破坏可令其失效。画面不等读心，认知只随实际收到的信息改变。
    severity: hard
  - id: root-detail-recovery-materials
    text: 灵石、魔石、灵乳或疗伤药补充力量须消耗真实材料、匹配法体并用时吸收；特定治疗方法不通治全部伤病，轮换催舟不消除耗能。
    severity: hard
  - id: root-detail-divination-limits
    text: 卜算须相应器物、知识与施术，能被遮蔽且可能伤神耗寿；信息是受条件限制的结果，不保证固定未来或全知追踪。
    severity: hard
  - id: root-detail-space-route-risk
    text: 强斗法可能使空间通道失稳、起风暴或坍塌，按实际能量与通道条件判断，不能仅凭通道二字禁止所有行动。
    severity: hard
  - id: root-detail-mahayana-tribulation
    text: 进阶大乘的雷劫、心魔及法体重铸分别发生，防护法阵与收雷器要真实知识、材料和供能。个例雷次与异象不保证人人相同；强天象可影响周围。
    severity: hard
  - id: root-detail-mind-tribulation
    text: 心魔幻景可呈亲友与多世经历，不改外界历史或生成真实新亲属；识破与承受需实际神念和修习。
    severity: hard
  - id: root-detail-true-spirit-rank
    text: 真灵是生灵类别而非统一修为值，种类、成长、个体与法门皆影响战力；名称与血统不赋无敌，修士变化不等完整真灵本体。
    severity: hard
  - id: root-detail-beast-contract
    text: 灵兽血咒、神魂感应和独立意愿分别存在，解除或转契须具体条件；解除一类禁制可能仍留其他联系。
    severity: hard
  - id: root-detail-material-resistance
    text: 硬材仍有承受极限，普通攻击弹开不等永不可损；材料类别不代表当地已存在制成的兵器。
    severity: hard
  - id: root-detail-domain-law-costs
    text: 伪灵域、真灵域与不同法则强度有别，缩域增防仍耗力量。时间之力受元神消耗、封禁与对抗限制，不允许无限回档整个世界。
    severity: hard
  - id: root-detail-self-repair-material
    text: 具重元塑灵特性的材料可随时间修部分损伤，彻底湮灭不能恢复；不泛用于所有材料，也不瞬间治任何伤。
    severity: hard
  - id: root-detail-great-tribulations
    text: 未真正飞升者仍面对大天劫，越渡越险是常见趋势；防劫器物和准备须实际存在，不由历法强制某人死亡或保证成功。
    severity: hard
