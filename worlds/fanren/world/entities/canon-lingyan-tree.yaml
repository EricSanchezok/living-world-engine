      value: 以floor((自开篇起实际经过的共同秒数+4415040000)/6307200000)标识本树当前产液周期。只在产液窗口、树体存活且生境未受破坏时可首次检查采集；本周期标识必须大于last-collected-cycle，一次至多获得二十四滴醇液，并在同一事务更新last-collected-cycle。未采过的旧窗口不得追补，树坏死或产液失败不会补偿凭空库存。
