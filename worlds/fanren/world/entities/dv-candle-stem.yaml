id: dv-candle-stem
kind: item
name: 灵烛果植株
description: 湖泥中独立生长的灵烛果植株，移植会损毁；枝上结着成熟灵果。
placement: dv-oasis
facts:
  - id: dv-candle-stem-harvest-rule
    predicate: harvest-rule
    value:
      kind: text
      value: 采摘后须在半个人界日内入鼎炼药；超过半日效力大减，超过三个人界日效力全失。合适木器仅能短时保存，不能取消时限。需完整造化丹配方、辅材与炉火；普通储放不自动成丹，断茎移植会损药。
