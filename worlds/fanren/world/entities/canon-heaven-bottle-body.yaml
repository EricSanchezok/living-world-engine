  - id: canon-heaven-bottle-body-condensation-rule
    predicate: conditional-conversion
    value:
      kind: text
      value: 须在明净夜空下有光线实际照达；袋、盒、厚叶遮蔽及阴雨不累计。人界天象下约七个完整合格夜晚、灵界已证环境下约三个当地合格夜晚的等效暴露量凝成一滴，部分夜晚按实际有效时长累计，跨界按完成比例换算进度。生成时扣除这一轮全部进度，已有一滴未取出则不继续积累；瓶盖可随凝成后正常开启。灵界吸光时仅有淡白光，近前仔细观察仍可能发现。其他未验证界面不能照搬；月亮多寡或灵气浓度不能单独据以无限加速。
    description: 凝液取决于实际环境与连续记录。
    access:
      kind: private
