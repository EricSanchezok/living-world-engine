  - id: canon-heaven-bottle-body-plant-use
    predicate: plant-use
    value:
      kind: text
      value: 原液需对已有植物实际施用并扣除所用滴量。已证一滴对一株普通人参隔夜增至百年药性，三乌草反复滴用可继续增龄；稀释分施许多草药只有较弱增长。其他种类与剂量须按实际效果判断，不保证全植物同倍率，也不能无中生株。直接给动物服用有胀体爆裂的实证风险；催熟草药制药另依实际方药。
    description: 滴液必须真实消耗，作用按对象判断。
    access:
      kind: private
  - id: canon-heaven-bottle-body-liquid-storage
    predicate: liquid-storage
    value:
      kind: text
      value: 瓶内原液可留存；取出时记数量、容器和时间。普通容器原液一刻即900秒后消散失效，稀释稍久亦会失效。具有已证储灵能力的黄铜瓶法器可将保存延至一天即86400秒，过时仍消散；普通铜瓶不因材质相同获得该能力，其他未经验证的保存期限不能凭称述取得。
    description: 取出凝液须及时使用。
    access:
      kind: private
