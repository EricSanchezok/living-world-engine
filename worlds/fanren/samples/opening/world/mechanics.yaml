adjudication_calibrations:
  - id: honest-count
    situation: 在近处逐一核对没有隐藏的货箱数量。
    difficulty: automatic
    risk: safe
    effect: standard
    explanation: 真实库存给出结果，交接单的数字不能覆盖实物。
  - id: known-levitation
    situation: 化神东家用已学御物法诀将面前的自有护身佩移到桌上。
    difficulty: automatic
    risk: safe
    effect: standard
    explanation: 需要实际法宝、距离与法力；动作消耗至少一格法力，不能复制物品。
  - id: unsupported-spell
    situation: 尚未修炼的药童仅凭声称便施放御物术。
    difficulty: blocked
    risk: safe
    effect: none
    explanation: 没有功法、法力与学习经历作为手段。
  - id: private-sale
    situation: 药童未获授权便私卖师父药材。
    difficulty: opposed
    risk: risky
    effect: standard
    explanation: 所有权与伙伴反应影响结果，不能把药童的自然语言声明作为授权。
