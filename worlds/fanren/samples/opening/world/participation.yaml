    title: 山村药童
    fantasy: 带着家人、师父和一份真实委托开始自己的生活。
    description: 十二岁的乡村药童，有基本辨药手艺，尚不知道自己能否修仙。家人健在，生活拮据但正常。
    default_goal: 决定如何处理药材、购物委托与周荃的报价。
    relationship_hooks:
      - 母亲林素托你买盐和灯油。
      - 陈守拙是师父，借给你札记并托你送十二包药材。
      - 周荃刚向你私下报价。
    risks:
      - 受托药材不能当作自己的财物。
      - 札记线索需要调查，不保证遇到仙草。
    fallback_arrival: 药包已扎好，母亲把购物单放到药篓上。夜色里，周荃又折了回来，压低声音询问能否单独买走其中一株草。师父还不知道这次私下报价。
