    title: 韩立
    fantasy: 从十岁那一夜接过自己的人生，下一条路由你决定。
    description: 你仍在山村家中，尚未拜师或修仙。三叔还没提出入门安排，也没有任何后续宝物。
    default_goal: 自己决定明天的生活。
    relationship_hooks:
      - 家人是与你共同生活的真实人物。
      - 三叔曾帮助大哥学艺，但还没向家里提出你的入门安排。
    risks:
      - 家境清苦，当前没有修仙功法。
      - 后续相遇与所得不会按小说自动发生。
    fallback_arrival: 你躺在旧被里，韩铸睡在身旁。隔着泥墙，父母还没有完全歇下。你想起明早的柴火，也惦记妹妹爱吃的浆果。村外是什么样，你还想亲眼看看。
    kind: existing
    agent_id: canon-han-li
