    title: 镖局学徒
    fantasy: 信物可用于请人传话，联络耗时。承诺不是召唤令或强制服从；兑现人情不等于获得灵根。若发现原著确有适用的特殊机制，须另行满足条件，不能从出身奖励直接解锁。
