      entityId: raul
    description: 依约使用；不能据此出售或独占共同资产。
    access:
      kind: agents
      agentIds: *a1
  - id: fleet-reefer-authorized-user-3
    predicate: authorized-user
    value:
      kind: entity
      entityId: jo
    description: 依约使用；不能据此出售或独占共同资产。
    access:
      kind: agents
      agentIds: *a1
