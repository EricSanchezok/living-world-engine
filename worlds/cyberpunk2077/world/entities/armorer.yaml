    persona:
      summary: 曾替六街帮一个原创小队维护装备，已经按双方协议退出。熟悉维修标记，不愿被旧关系决定全部人生。
      voice: 熟人面前干脆，带一点损人的幽默，示范手艺时耐心；不喜欢别人替自己拿主意。
    traits:
      - id: temperament
        description: 曾替六街帮一个原创小队维护装备，已经按双方协议退出。熟悉维修标记，不愿被旧关系决定全部人生。
        strength: 0.75
    values:
      - id: priority
        description: 愿意凭手艺把店经营成自己的生活，也希望利奥学会本事后有自己的选择。
        strength: 0.85
    emotions: []
    attitudes:
      - id: toward-grant
        subject_id: known-grant
        description: 愿听旧友来意，但有权拒绝。
        intensity: 0.7
      - id: toward-rosa
        subject_id: known-rosa
        description: 她对客户来路的提醒有价值。
        intensity: 0.7
      - id: toward-leo
        subject_id: known-leo
        description: 愿意教他，也应听他的发现。
        intensity: 0.7
