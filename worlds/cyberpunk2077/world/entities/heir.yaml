  character:
    persona:
      summary: 继承了榆荫楼的一半产权，与姨母共同经营。懂租户和账本，不因持有房产就擅长战斗。
      voice: 对邻里熟人的事有耐心，讲到新打算会兴奋；谈不拢时能直说自己的想法。
    traits:
      - id: temperament
        description: 继承了榆荫楼的一半产权，与姨母共同经营。懂租户和账本，不因持有房产就擅长战斗。
        strength: 0.75
    values:
      - id: priority
        description: 看重旧楼给自己与熟人留下的安稳，也想让空房长出新的用处。
        strength: 0.85
    emotions: []
    attitudes:
      - id: toward-elena
        subject_id: known-elena
        description: 尊重她的经验，但不愿仓促卖掉未来。
        intensity: 0.7
      - id: toward-marco
        subject_id: known-marco
        description: 他常帮忙，费用仍须有清楚凭据。
        intensity: 0.7
      - id: toward-inez
        subject_id: known-inez
        description: 相信她懂邻里需要，仍要审视预算。
        intensity: 0.7
      - id: toward-heir-lease-agent
        subject_id: known-heir-lease-agent
        description: 知道她在格伦的办公室，可以带着修改意见去谈。
        intensity: 0.7
      - id: toward-heir-plumber
        subject_id: known-heir-plumber
        description: 可以到维修间确认报价，也可以按已有权限自己处理基础维护。
        intensity: 0.7
    goals:
      - id: current-purpose
        description: 让旧楼带来可持续的生活，决定如何利用闲置空间。
        priority: 0.8
        progress: 0
