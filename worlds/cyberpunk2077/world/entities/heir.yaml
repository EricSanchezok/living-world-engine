        description: 社区空间提案来自榆荫邻里合作社，伊内兹是本次受托代表。
        status: observed
      - id: known-heir-rent-account
        name: 榆荫楼共同经营收款账户
        description: 两位共有人接收实际租金的共同账户，初始没有本次提案收入；收款不改变各半产权。
        status: observed
      - id: known-heir-lease-settlement
        name: 嘉衡本次首月租金账户
        description: 已有的首月业务资金与代表私人现金分开；真实签约并完成约定空间交接后，代表才能在此终端申请本期付款。
        status: observed
      - id: known-heir-community-settlement
        name: 邻里合作社首月空间款账户
        description: 已有的首月业务资金与代表私人现金分开；真实签约并完成约定空间交接后，代表才能在此终端申请本期付款。
        status: observed
      - id: known-heir-plumber-work
        name: 莫兰管线维修间
        description: 莉迪亚的独立维修间，门口有营业时段和可现场确认的预约本；可以前来核对800欧元报价，再商议上门时间。
        status: observed
      - id: known-heir-plumber
        name: 莉迪亚·莫兰
        description: 马尔科向诺亚介绍过莉迪亚的店，桌上的800欧元文件是她的初步报价，双方未下单。 可以到维修间确认报价，也可以按已有权限自己处理基础维护。
        status: observed
      - id: known-heir-plumbing-order
        name: 榆荫楼基础止漏待议施工单
        description: 莉迪亚拟以800欧元核对漏点、隔离这段水路、在适配时使用楼内一枚常备密封垫完成基础更换并复压；范围须现场确认。两位共有人与施工方尚未签约，未付款、未施工。可协商有明确金额的预付款与验收尾款；马尔科代办须另有明确委托，自修不自动欠莉迪亚800欧元。
        status: observed
