        description: 诺亚·鲁伊斯是一名成年人，在榆荫楼一楼会客室处理自己的生活和事业。
        status: observed
      - id: known-heir-work
        name: 榆荫楼一楼会客室
        description: 可通过街区道路到达的实际营业或工作场所；营业空间与私人住所分开。
        status: observed
      - id: known-heir-home
        name: 榆荫楼顶层自住公寓
        description: 我的住所是榆荫楼顶层自住公寓，可以返回休息、接待客人或保管自己的物品。
        status: observed
      - id: known-elena
        name: 埃琳娜·鲁伊斯
        description: 双方各有榆荫楼 50% 产权，重大处分须共同同意。 尊重她的经验，但不愿仓促卖掉未来。
        status: observed
      - id: known-marco
        name: 马尔科·维达尔
        description: 已共同核对漏水问题；800 欧元只是待核报价，马尔科尚未垫付，诺亚没有因此欠下报销款。 他常帮忙，费用仍须有清楚凭据。
        status: observed
      - id: known-inez
        name: 伊内兹·赵
        description: 已经一起讨论过用闲置空间换取修缮支持。 相信她懂邻里需要，仍要审视预算。
        status: observed
      - id: known-heir-building
        name: 榆荫楼产权及经营标的
        description: 包含六间出租公寓、洗衣店和一间闲置工作室的旧楼；资产不是随身物品。
        status: observed
      - id: known-heir-vacant
        name: 榆荫楼闲置工作室
        description: 可改作办公室、诊疗合作点或排练间，现为空置。
        status: observed
      - id: known-heir-utility-room
        name: 榆荫楼公共管线间
        description: 一楼会客室沿楼内走廊可到的检修间。共有人和受委托维修者可进入；狭窄走道有接水盘，不能在会客室隔空修管。
        status: observed
      - id: known-heir-service-pipe
        name: 漏水的公共冷水管活接
        description: 公共冷水立管上的活接，底部接水盘可见持续水滴；检修需先靠近、确认水路和实际隔离。
        status: observed
      - id: known-heir-plumbing-tools
        name: 榆荫楼管线检修工具
        description: 活动扳手、绝缘照明灯、接水盘和水压表，能支持这段冷水管的现场检查及基础维护。
        status: observed
      - id: known-heir-seal-stock
        name: 榆荫楼兼容密封垫小盒
        description: 两枚与该冷水管活接规格相容的常备密封垫，归共同维修物资；更换一枚须实际消耗一单位登记组件。
        status: observed
      - id: known-heir-fund
        name: 榆荫楼维修账户
        description: 专项维修资金，双方知情后可支付实际工程。
        status: observed
      - id: known-heir-repair-quote
        name: 800 欧元管道维修报价单
        description: 桌上的维修报价文件，列出拟议工程范围；不是已付款发票。
        status: observed
      - id: known-heir-lease-offer
        name: 五年包租要约
        description: 外部运营方提出为期五年、每月 7000 欧元的包租，要求完整使用闲置房及到期合法调整租约。尚未签字、无预付款；可要求现有租客保护条款。报价期限是五年，7000 是月租金额，不是租期。
        status: observed
      - id: known-heir-repair-offer
        name: 修缮与社区空间合作
        description: 社区合作方愿以每月 4200 欧元收入及分期修缮换取工作室使用；先核验报价、分工与验收，再签约。首笔维修可单独处理。
        status: observed
      - id: known-heir-maintenance-log
        name: 榆荫楼维修工作簿
        description: 持有该物的所有权。
        status: observed
      - id: known-heir-lease-office
        name: 嘉衡物业格伦办事处
        description: 一家原创小型物业运营商的营业办公室。萨娜在这里接待预约，桌边有办理本次首月租金的支付终端。
        status: observed
      - id: known-heir-lease-agent
        name: 萨娜·贝克
        description: 萨娜此前与诺亚和埃琳娜一起看过楼，提出书面方案，双方尚未签约。 知道她在格伦的办公室，可以带着修改意见去谈。
        status: observed
      - id: known-heir-lease-company
        name: 嘉衡物业运营
        description: 五年包租要约的实际提案方是嘉衡物业运营。
        status: observed
      - id: known-heir-community-office
        name: 榆荫邻里合作社小办公室
        description: 邻里合作社在格伦租用的既有办公室，准备社区空间合作并保管自己的业务资料；它还没有取得榆荫楼工作室使用权。
        status: observed
      - id: known-heir-community-coop
