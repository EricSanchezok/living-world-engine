      - id: consider-fleet-community-order
        description: 就社区水处理设备委托作出符合自身利益的决定；允许修改、拒绝或延期。
        priority: 0.65
        progress: 0
        target_ids:
          - known-fleet-community-order
        motivated_by_ids:
