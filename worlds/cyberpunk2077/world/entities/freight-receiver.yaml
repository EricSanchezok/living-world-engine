      - id: known-fleet-destination
        name: 阿罗约货运交接仓
        description: 有正常道路入口、可泊车的卸货区及分开的工业货与社区设备收货位；接受按约到达的货运，不允许从营地隔空签收。
        status: observed
      - id: known-fleet
        name: O05 米卡·梅萨｜有三辆卡车的车队接班人
        description: 曾按正常流程共同完成仓库交接。 认识米卡，但仍要看到实际货物与本次货单。
        status: observed
      - id: known-mei
        name: 梅·托雷斯
        description: 梅协调窗口，黛娜在仓库清点实际货物。 能向梅说明到货和异常，不替司机承担缺件。
        status: observed
      - id: known-fleet-cargo
        name: 已装箱的水处理设备
        description: 四箱社区水处理设备，独立于普通工业货的一批。
        status: observed
      - id: known-fleet-regular-cargo
        name: 待运的六箱普通工业货
        description: 六箱普通工业货，R-01至R-06，不要求低温运输。
        status: observed
      - id: known-fleet-regular-order
        name: 长期客户普通货运单
        description: 拟运现场R-01至R-06普通工业货六箱至阿罗约货运交接仓，黛娜实际清点签收后由梅向车队公账结算5200欧元；平板或厢式车可按实装容量调度，不需冷链。仍须商定窗口并确认接单，可改日或转包；尚未交付付款。
        status: observed
      - id: known-fleet-community-order
        name: 社区水处理设备委托
        description: 四箱水处理设备拟用平板车运至阿罗约货运交接仓的社区设备收货位，由黛娜单独签收，梅据此向车队公账结算2800欧元；可拼货或分期交付，窗口和接单待协商，普通货物的签收不能代替本批。
        status: observed
      - id: known-broker
        name: O09 卢卡·萨迪克｜狗镇的双边运输经纪
        description: 以前在阿罗约仓完成过普通交接。 按本批授权和实物收货，不把以前认识当成这次已收到。
        status: observed
      - id: known-broker-received-stock
        name: 晨线作坊控制器收货位
        description: 晨线作坊的本批收货位现在为空，只有实际到货才能填入库存。
        status: observed
      - id: known-broker-batch
        name: 实际到仓的四箱 A3 控制器
        description: 拟接收的是B-01至B-04四箱控制器，独立于其他普通货与社区水处理设备。
        status: observed
      - id: known-broker-delivery
        name: A2 设备交付订单待变更单
        description: 原拟四箱A2按批8000欧元，供货商7600、经纪费400；现货A3须由奥斯卡与选定买方重新确认型号适配、价格和归属。若俊代表晨线作坊接受，先更新本批许可、实际运至阿罗约仓由黛娜清点，俊核验后从专户分别付货款与经纪费。维拉可提出另购，但不能把同批货卖两遍；未签变更、未过关、未交付、未收款。
        status: observed
      - id: known-fleet-delivery-log
        name: 车队分批交付与签收记录
        description: 这是可供本次工作使用的车队分批交付与签收记录，现在尚未填写。分别记录两批装车、道路运输、到仓箱数及黛娜真实签收；梅依据真实签收办理对应运费，不能把四箱社区设备当作六箱普通货。
        status: observed
