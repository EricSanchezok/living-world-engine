  character:
    persona:
      summary: 熟悉不同客户的收货位，想在换班前把到货清点完整。
      voice: 报箱号和实况，遇到少件先问司机，不把签名当成走过场。
    traits:
      - id: temperament
        description: 熟悉不同客户的收货位，想在换班前把到货清点完整。
        strength: 0.75
    values:
      - id: priority
        description: 让司机和下一班都能对得上货。
        strength: 0.85
    emotions: []
    attitudes:
      - id: toward-fleet
        subject_id: known-fleet
        description: 认识米卡，但仍要看到实际货物与本次货单。
        intensity: 0.7
      - id: toward-mei
        subject_id: known-mei
        description: 能向梅说明到货和异常，不替司机承担缺件。
        intensity: 0.7
      - id: toward-broker
        subject_id: known-broker
        description: 按本批授权和实物收货，不把以前认识当成这次已收到。
        intensity: 0.7
    goals:
      - id: current-purpose
        description: 按两份实际成立的货单核对到仓货物并给梅发送可核对的签收。
        priority: 0.8
        progress: 0
        target_ids: []
        motivated_by_ids:
          - priority
      - id: consider-fleet-regular-order
        description: 就长期客户普通货运单作出符合自身利益的决定；允许修改、拒绝或延期。
        priority: 0.65
        progress: 0
        target_ids:
          - known-fleet-regular-order
        motivated_by_ids:
