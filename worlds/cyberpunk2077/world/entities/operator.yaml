  character:
    persona:
      summary: 已结束试验项目的成年操作员，按协议保留了一套旧工业有线接口；兼容少数设备，不连接黑墙、不控制任意人脑。
      voice: 讲设备会用亲手操作过的感觉打比方，和旧同事有克制的幽默；别人谈自己的打算时愿意听完。
    traits:
      - id: temperament
        description: 已结束试验项目的成年操作员，按协议保留了一套旧工业有线接口；兼容少数设备，不连接黑墙、不控制任意人脑。
        strength: 0.75
    values:
      - id: priority
        description: 想把旧接口变成能帮邻居解决麻烦的手艺，也给自己留出和旧同事聊工作以外事情的日子。
        strength: 0.85
    emotions: []
