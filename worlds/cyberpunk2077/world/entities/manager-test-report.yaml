id: manager-test-report
kind: data-file
name: 折光排练室试播记录
description: 已有的本地工作记录文件；需要打开才能读取内容，可以在授权范围内续写。
placement: manager-work
facts:
  - id: manager-test-report-owner-1
    predicate: owner
    value:
      kind: entity
      entityId: manager
    description: 持有该物的所有权。
    access:
      kind: agents
      agentIds:
        - manager
  - id: manager-test-report-entries-2
    predicate: entries
    value:
      kind: text
      value: 空白：尚未记录本次工作的观察、操作或结果。
    description: 本次工作记录的正文；只能由实际观察和已发生的操作形成。
    access:
      kind: agents
      agentIds: &a1
        - manager
        - rin
        - bex
        - paulo
  - id: manager-test-report-record-state-3
    predicate: record-state
    value:
      kind: text
      value: blank
    description: 空白、草稿或已复核依实际填写与复核改变；文档存在不代表工作完成。
    access:
      kind: agents
      agentIds: *a1
  - id: manager-test-report-record-purpose-4
    predicate: record-purpose
    value:
      kind: text
      value: 记录实际试播的接口、音量和听到的问题，注明仅在排练室内部使用；不修改母带、不据此获得公开传播授权。
    description: 折光排练室试播记录的record-purpose记录。
    access:
      kind: agents
      agentIds: *a1
  - id: manager-test-report-authorized-writer-5
    predicate: authorized-writer
    value:
      kind: entity
      entityId: manager
    description: 本人可以据实填写，修改记录不改变原始材料或独立验收结果。
    access:
      kind: agents
      agentIds: *a1
  - id: manager-test-report-record-subject-6
    predicate: record-subject
    value:
      kind: entity
      entityId: manager-gear
    description: 这份记录对应的实物、原始文件或工作对象。
    access:
      kind: agents
      agentIds: *a1
  - id: manager-test-report-record-subject-7
    predicate: record-subject
    value:
      kind: entity
      entityId: manager-song
    description: 这份记录对应的实物、原始文件或工作对象。
    access:
      kind: agents
      agentIds: *a1
meters: []
quantities: []
ratings: []
