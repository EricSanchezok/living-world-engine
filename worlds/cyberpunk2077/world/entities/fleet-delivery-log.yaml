id: fleet-delivery-log
kind: data-file
name: 车队分批交付与签收记录
description: 已有的本地工作记录文件；需要打开才能读取内容，可以在授权范围内续写。
placement: fleet-work
facts:
  - id: fleet-delivery-log-owner-1
    predicate: owner
    value:
      kind: entity
      entityId: fleet
    description: 持有该物的所有权。
    access:
      kind: agents
      agentIds:
        - fleet
  - id: fleet-delivery-log-entries-2
    predicate: entries
    value:
      kind: text
      value: 空白：尚未记录本次工作的观察、操作或结果。
    description: 本次工作记录的正文；只能由实际观察和已发生的操作形成。
    access:
      kind: agents
      agentIds: &a1
        - fleet
        - raul
        - jo
        - mei
        - freight-receiver
  - id: fleet-delivery-log-record-state-3
    predicate: record-state
    value:
      kind: text
      value: blank
    description: 空白、草稿或已复核依实际填写与复核改变；文档存在不代表工作完成。
    access:
      kind: agents
      agentIds: *a1
  - id: fleet-delivery-log-record-purpose-4
    predicate: record-purpose
    value:
      kind: text
      value: 分别记录两批装车、道路运输、到仓箱数及黛娜真实签收；梅依据真实签收办理对应运费，不能把四箱社区设备当作六箱普通货。
    description: 车队分批交付与签收记录的record-purpose记录。
    access:
      kind: agents
      agentIds: *a1
  - id: fleet-delivery-log-authorized-writer-5
    predicate: authorized-writer
    value:
      kind: entity
      entityId: fleet
    description: 本人可以据实填写，修改记录不改变原始材料或独立验收结果。
    access:
      kind: agents
      agentIds: *a1
  - id: fleet-delivery-log-record-subject-6
    predicate: record-subject
    value:
      kind: entity
      entityId: fleet-cargo
    description: 这份记录对应的实物、原始文件或工作对象。
    access:
      kind: agents
      agentIds: *a1
  - id: fleet-delivery-log-record-subject-7
    predicate: record-subject
    value:
      kind: entity
      entityId: fleet-regular-cargo
    description: 这份记录对应的实物、原始文件或工作对象。
    access:
      kind: agents
      agentIds: *a1
  - id: fleet-delivery-log-record-subject-8
    predicate: record-subject
    value:
      kind: entity
      entityId: fleet-destination
    description: 这份记录对应的实物、原始文件或工作对象。
    access:
      kind: agents
      agentIds: *a1
meters: []
quantities: []
ratings: []
