        name: 长期客户普通货运单
        description: 拟运现场R-01至R-06普通工业货六箱至阿罗约货运交接仓，黛娜实际清点签收后由梅向车队公账结算5200欧元；平板或厢式车可按实装容量调度，不需冷链。仍须商定窗口并确认接单，可改日或转包；尚未交付付款。
        status: observed
      - id: known-fleet-community-order
