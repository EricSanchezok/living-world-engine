id: editor-edit-log
kind: data-file
name: 放映工作版修订与授权记录
description: 已有的本地工作记录文件；需要打开才能读取内容，可以在授权范围内续写。
placement: editor-work
facts:
  - id: editor-edit-log-owner-1
    predicate: owner
    value:
      kind: entity
      entityId: editor
    description: 持有该物的所有权。
    access:
      kind: agents
      agentIds:
        - editor
  - id: editor-edit-log-entries-2
    predicate: entries
    value:
      kind: text
      value: 空白：尚未记录本次工作的观察、操作或结果。
    description: 本次工作记录的正文；只能由实际观察和已发生的操作形成。
    access:
      kind: agents
      agentIds: &a1
        - editor
        - sora
        - tomas
        - celia
  - id: editor-edit-log-record-state-3
    predicate: record-state
    value:
      kind: text
      value: blank
    description: 空白、草稿或已复核依实际填写与复核改变；文档存在不代表工作完成。
    access:
      kind: agents
      agentIds: *a1
  - id: editor-edit-log-record-purpose-4
    predicate: record-purpose
    value:
      kind: text
      value: 记录实际改动、回放结果与当事人明确给出的授权；原始素材保持独立，已剪辑不等于已发行。
    description: 放映工作版修订与授权记录的record-purpose记录。
    access:
      kind: agents
      agentIds: *a1
  - id: editor-edit-log-authorized-writer-5
    predicate: authorized-writer
    value:
      kind: entity
      entityId: editor
    description: 本人可以据实填写，修改记录不改变原始材料或独立验收结果。
    access:
      kind: agents
      agentIds: *a1
  - id: editor-edit-log-record-subject-6
    predicate: record-subject
    value:
      kind: entity
      entityId: editor-footage
    description: 这份记录对应的实物、原始文件或工作对象。
    access:
      kind: agents
      agentIds: *a1
  - id: editor-edit-log-record-subject-7
    predicate: record-subject
    value:
      kind: entity
      entityId: editor-cut
    description: 这份记录对应的实物、原始文件或工作对象。
    access:
      kind: agents
      agentIds: *a1
  - id: editor-edit-log-record-subject-8
    predicate: record-subject
    value:
      kind: entity
      entityId: editor-release-file
    description: 记录实际核对的条款及最后认可，不能仅写“已授权”跳过回放与当事人判断。
    access:
      kind: agents
      agentIds:
        - editor
        - tomas
        - sora
        - celia
meters: []
quantities: []
ratings: []
