    predicate: approval-status
    value:
      kind: text
      value: valid-for-A2-only
    description: 当前许可仍只对应A2；埃米尔按职权核对实物与更新材料后才能办理本批A3许可，不自动放行。
    access:
      kind: agents
      agentIds:
        - broker
        - jun
        - emil
        - broker-supplier
  - id: broker-permit-authorized-writer-4
    predicate: authorized-writer
