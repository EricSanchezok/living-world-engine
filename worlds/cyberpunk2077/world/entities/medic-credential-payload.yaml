id: medic-credential-payload
kind: data-file
name: 凭证内部的编码记录
description: 凭证中的受限编码记录，需要在本人出示并同意后实际读取；外壳本身不会公开有效期和校验结果。
placement: medic-service-card
facts:
  - id: medic-credential-payload-credential-content-1
    predicate: credential-content
    value:
      kind: text
      value: 编号TT-NC-EVA-17，登记人伊娃·洛；凭证处于当前有效期，本人可请求按合同评估服务。它不载有派出车辆、当前医疗必要性、免费项目或响应时间的批准。
    description: 凭证内容须实际出示和读取；有效成员身份不等于所有医疗请求已获调度批准。
    access:
      kind: agents
      agentIds:
        - injured-subscriber
        - medic
        - mateo
  - id: medic-credential-payload-signature-valid-2
    predicate: signature-valid
    value:
      kind: boolean
      value: true
    description: 这份既有凭证能通过马特奥当前工作核验器的发行方签名校验；必须实际查验才形成当场结论。
    access:
      kind: agents
      agentIds:
        - mateo
  - id: medic-credential-payload-registered-holder-3
    predicate: registered-holder
    value:
      kind: entity
      entityId: injured-subscriber
    description: 凭证绑定伊娃本人，不能借给另一伤者变成对方合同。
    access:
      kind: agents
      agentIds:
        - injured-subscriber
        - medic
        - mateo
