id: broker-discrepancy-log
kind: data-file
name: 本批控制器型号核对记录
description: 已有的本地工作记录文件；需要打开才能读取内容，可以在授权范围内续写。
placement: broker-work
facts:
  - id: broker-discrepancy-log-owner-1
    predicate: owner
    value:
      kind: entity
      entityId: broker
    description: 持有该物的所有权。
    access:
      kind: agents
      agentIds:
        - broker
  - id: broker-discrepancy-log-entries-2
    predicate: entries
    value:
      kind: text
      value: 空白：尚未记录本次工作的观察、操作或结果。
    description: 本次工作记录的正文；只能由实际观察和已发生的操作形成。
    access:
      kind: agents
      agentIds: &a1
        - broker
        - vera
        - jun
        - emil
  - id: broker-discrepancy-log-record-state-3
    predicate: record-state
    value:
      kind: text
      value: blank
    description: 空白、草稿或已复核依实际填写与复核改变；文档存在不代表工作完成。
    access:
      kind: agents
      agentIds: *a1
  - id: broker-discrepancy-log-record-purpose-4
    predicate: record-purpose
    value:
      kind: text
      value: 记录逐箱核对结果、A2/A3差异、买家的实际答复和许可办理进展；文件更正草稿不代表已经批准过关。
    description: 本批控制器型号核对记录的record-purpose记录。
    access:
      kind: agents
      agentIds: *a1
  - id: broker-discrepancy-log-authorized-writer-5
    predicate: authorized-writer
    value:
      kind: entity
      entityId: broker
    description: 本人可以据实填写，修改记录不改变原始材料或独立验收结果。
    access:
      kind: agents
      agentIds: *a1
  - id: broker-discrepancy-log-record-subject-6
    predicate: record-subject
    value:
      kind: entity
      entityId: broker-batch
    description: 这份记录对应的实物、原始文件或工作对象。
    access:
      kind: agents
      agentIds: *a1
  - id: broker-discrepancy-log-record-subject-7
    predicate: record-subject
    value:
      kind: entity
      entityId: broker-permit
    description: 这份记录对应的实物、原始文件或工作对象。
    access:
      kind: agents
      agentIds: *a1
  - id: broker-discrepancy-log-record-subject-8
    predicate: record-subject
    value:
      kind: entity
      entityId: broker-delivery
    description: 这份记录对应的实物、原始文件或工作对象。
    access:
      kind: agents
      agentIds: *a1
meters: []
quantities: []
ratings: []
