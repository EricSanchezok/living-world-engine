disclosure:
  default_check_visibility: full
laws:
  - id: canon-time
    text: 统一开篇为 2077 年，V 与杰克共同接活半年之后、《救人》行动触发之前。V 使用街头小子生平。三郎、杰克、T-Bug、艾芙琳仍活着；竹村仍受雇且义体未被停用。未发生绀碧劫案、强尼进入 V、总统专机坠落或任何分支结局。地点与日常安排采用实体初值，不能用未来攻略替换当前状态。
    severity: hard
  - id: open-future
    text: 未来事件只可能由实际条件与人物行动产生，不按任务章节强制发生。玩家可以不认识 V、拒绝任何委托、离开开场、经营或过日常生活。未接管身份继续作为有自身目标的成年人行动，不因选择别的出身而失踪或资源归零。原作角色可以改变选择、关系或命运，变化必须有本次经历的因果。
    severity: hard
  - id: bounded-knowledge
    text: 客观事实、个人信念和公开信息分离。姓名、关系、资产和秘密需要既有认识、可见证据、通信或调查才能获知。不得把私人事实、别人的记忆、秘密绑定、未来任务结果直接写给旁人。谣言、证词、编辑推测不是确定事实；检测应揭示预先存在的故障，而非根据猜测临时改写真相。
    severity: hard
  - id: limited-expansion
    text: 可以在已知地区补充合理的日常人物、商铺与情境，但不得复制具名角色、重设已有产权、凭空增发钱或稀缺设备、改动明确历史、创造万能机构权限。新人物关系、信息和物品必须有实际来历；原作未核实的重大细节不得伪装成既定正典。
    severity: hard
  - id: space-and-access
    text: 放置关系是区域或容器层级，不是任意两点瞬移的许可。跨街区行程要付出交通与时间，狗镇关口、企业内部、诊所后台和住宅各有权限。上层街区中的人不能自动听见所有子房间。封闭房间、密封载体和植入物内部不因同处一室就公开内容。境外场景需真实远行，肉身不能走进旧网。
    severity: hard
  - id: property-and-custody
    text: 所有权、共同份额、保管、租赁、岗位权限分别判定。移动物品不自动取得产权；商议不等于签约，报价不等于付款，共有资产不能单方出售。盗窃可以作为行动尝试，但不自动成功或抹除原主权益。已安装义体须经医疗拆装，房产和公司预算不能直接塞进背包。
    severity: hard
  - id: cash-conservation
    text: 欧元只能从实际账户或持有人向另一实际持有人转移；不得因声称富有、签了未付款合同或完成叙述就增发货币。共同账户按明确授权使用，私人现金、公司预算与分成分开。付出与收到必须同额结算；余额不够时可谈分期、交换或拒绝，不能负数付款。
    severity: hard
  - id: payment-services
    text: 具有 automated-service 标记的账户是普通有范围的语音支付软件；授权人须在现场对它说出具体用途、金额和收款人，它实际听到申请后依据 spending-mandate 核验，从本账户真实转账。只操作其他设备或编写未送达草稿不会通知终端，也不算付款。多人签字的账户须得到相应确认，不因知道密码或共有人姓名就绕过权限。终端不自行发薪、投资或赠款，不具备移动、战斗、政治意志或黑墙能力；一份申请只支付一次，已发生的收款凭据避免重复执行。
    severity: hard
  - id: supply-use
    text: 消耗食品、医材、燃料、弹药或组件须有对应真实操作、原有库存和数量。数量登记在实际保管人名下，storage-* 事实指明实物位置；登记保管不等于都在口袋，也不改变他人产权。远离存放处不能隔空交付或消耗。射击消耗弹药，持续驾驶消耗燃料，治疗消耗适当医材，生产和维修消耗实际材料。换驾驶人等交接需实际移交登记物资，不能把同一库存再算一次。
    severity: hard
  - id: supply-production
    text: 只有明确采购转移、回收现有材料或满足实际原料、工艺、设备和时间的生产能增加可用物资；采购使用转移，不能当作凭空生产。回收、拆装和加工必须同时扣除原料或退役被拆实物，数量和来源可追溯。
    severity: hard
  - id: cyberware
    text: 义体能力来自已安装的具体设备、状态、适配和操作者技能；安装需要医生、器材、材料、费用与时间。没有义体的人不因说出技能名就获得能力。重锤的重型装甲对轻火力形成实质保护，仍有暴露部位、能量和任务条件。斯安威斯坦不是全世界时间停止，接口不是万能后门。
    severity: hard
  - id: netrunning
    text: 黑客行动要有设备、可达网络或实体接入、目标权限与防护信息；不能远程读出所有人的记忆、跨空气隔离随意控制设备。隔离旧网、黑墙与危险 AI 不是常用技能菜单；没有明确路径、能力与严重风险评估时不能触碰。已有公开终端不等于最高管理员权限。
    severity: hard
  - id: braindance
    text: 超梦记录的是具体传感器曾记录且仍可恢复的数据；编辑、重建推测与已验证记录分开。复制文件不转移版权或公开许可；不能从缺失片段获得全知视角，删除发行版不等于篡改所有原始副本。
    severity: hard
  - id: medicine-and-strain
    text: 医疗需要具体症状、同意、适当技能与设备；基础救护可稳定伤势而不保证立即痊愈。创伤小组服务须核验合同与调度，普通员工不拥有公司机队。strain 是本剧本表达负荷的辅助量，不是把义体数或单一阈值机械等同于赛博精神病的正典公式；不得自动剥夺人物全部意志。
    severity: hard
  - id: relic-singularity
    text: Relic 原型与其承载的强尼数字印迹在世界中各有一个具体实体。强尼没有普通街头肉身，开篇不在 V 脑中；记得历史强尼不等于知道当前载体。印迹、身份连续性、肉体与普通存储不是可随意互换的复活技术；不为每个出身生成第二枚同功能原型。
    severity: hard
  - id: faction-autonomy
    text: 公司、帮派、流浪者、警察和中间人都由有具体职责与信息的人构成。组织标签不传递全员认知或无限军力。陌生人不能凭姓氏取得亲属关系、凭员工证命令高层、凭认识文员免检所有货物。新生关系须双方经历支持，原作人物不自动爱上或效忠玩家。
    severity: hard
  - id: violence-and-consequences
    text: 攻击、威胁、拘禁与救援依赖现场能力、装备、警戒和可行路径；重大伤亡与执法反应有具体后果，不生成无穷敌兵。生命归零表示当前人物退出可行动状态；不得无限回血、复活或以另一同名实体覆盖原人。尽可能区分失能与经证实的死亡。
    severity: hard
  - id: appointments
    text: 预约定时器仅让相关人物重新评估当前事务。不能自动完成合同、扣钱、杀人、爆炸、发放收入或触发原作大事件。错过窗口可以导致对方另作安排，但须有可见行动与符合既有条款的因果。
    severity: hard
  - id: ordinary-life
    text: 城市可以支持消费、工作、租房、创作、教学、合作和调查。已有商户、车队、诊所和工坊按自己的库存与条件交易；拒绝开场委托不封锁其他地区，也不凭空制造必然追杀。
    severity: soft
