  - id: speech-time
    situation: 询问维修报价并听取对方意见。
    profile_id: conversation
    explanation: 按完整话语估计，不能把长谈压成一秒。
  - id: repair-time
    situation: 诊断并检修老型接口。
    profile_id: professional-work
    explanation: 工位、材料、同意和步骤都满足后才可能完成；不是一秒改好。
  - id: travel-time
    situation: 开车从海伍德到狗镇。
    profile_id: city-trip
    explanation: 使用具体道路、检查站、燃料与路况，不能因两地都属城市就瞬移。
  - id: wait-time
    situation: 在工坊等待半小时。
    profile_id: explicit-duration
    explanation: 明确时长仍可被先到的事件与人物行动打断。
