adjudication_calibrations:
  - id: own-payment
    situation: 有足够私人现金、收款人在场且同意的付款。
    difficulty: automatic
    risk: safe
    effect: standard
    explanation: 实际同额转账；不需要虚构失败概率，也不能凭空造钱。
  - id: company-theft
    situation: 要求把公司项目全部预算当私人财富。
    difficulty: blocked
    risk: risky
    effect: none
    explanation: 职位授权不支持该动作；可另外尝试有后果的盗用或谈合法分配。
  - id: joint-sale
    situation: 未征得共同产权人同意就出售整楼。
    difficulty: blocked
    risk: risky
    effect: none
    explanation: 个人只有一半产权；洽谈份额转让与说服共同人是另一些可行方向。
  - id: old-interface
    situation: 具备接线与诊断授权后读取兼容控制柜日志。
    difficulty: easy
    risk: safe
    effect: standard
    explanation: 特殊接口在明确范围内提供真实优势；不扩张成任意网络控制。
  - id: bd-repair
    situation: 修复仍有部分信号的旧超梦音轨。
    difficulty: challenging
    risk: safe
    effect: standard
    explanation: 技能和设备允许恢复可支持的内容，缺失信息仍可保持未知。
  - id: medical-scope
    situation: 学徒独自尝试复杂神经手术。
    difficulty: hard
    risk: dire
    effect: minor
    explanation: 工具与实际训练构成限制，应允许求援、转诊或拒绝。
  - id: heavy-armor
    situation: 普通手枪从正面射击重锤重型胸甲。
    difficulty: hard
    risk: dire
    effect: minor
    explanation: 装甲、火力、射界与对手反应决定结果，不能套用普通人中弹效果。
  - id: sealed-relic
    situation: 路过酒店大堂就认出套房保密载体的全部内容。
    difficulty: blocked
    risk: safe
    effect: none
    explanation: 缺乏观察、身份和访问路径，不向旁人泄露隐藏知识。
  - id: checkpoint
    situation: 持有本批许可但实际型号不符的车队申请通行。
    difficulty: challenging
    risk: risky
    effect: minor
    explanation: 须更新申报或协商检验；熟识文员不等于自动放行。
  - id: investigate
    situation: 比对两份矛盾证词与时间戳。
    difficulty: challenging
    risk: safe
    effect: standard
    explanation: 能发现支持或矛盾点，不因此直接知道完整责任链。
  - id: leave-opening
    situation: 角色拒绝开场合同，回家或去别处寻找工作。
    difficulty: automatic
    risk: safe
    effect: standard
    explanation: 已有生活、资产和自由仍成立；有关人物可以有自己的反应。
  - id: future-story
    situation: 因为攻略如此安排就让专机在此刻坠落。
    difficulty: blocked
    risk: safe
    effect: none
    explanation: 没有本次实际条件，不触发章节式固定结果。
