schema_version: 17
id: blackmarsh
name: 黑沼边境
version: 1.2.0
description: 基于 Robert Conley 的 Blackmarsh v11（来源 https://batintheattic.blogspot.com/2018/11/blackmarsh-updated.html，许可 https://creativecommons.org/licenses/by/4.0/）翻译和改编的开放奇幻世界；改编者为 Living World Engine contributors，内容已作时间线、空间、Agent 与机制转换。
runtime_defaults:
  max_autonomous_span_seconds: 300
  realtime_interval_ms: 300000
  action_window_ms: 60000
model_profiles:
  decision: decision-jev
  creation: creation-deepseek
  fallback: decision-deepseek
narrative:
  language: zh-CN
  style: 中文第二人称，质朴具体的边境奇幻小说。让地方风物与人物态度从可见细节和对白中显露，日常片段简洁，重要交谈充分展开。
  expansion: true
