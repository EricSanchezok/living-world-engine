        priority: 0.96
        progress: 0.72
        target_ids: [company, harbor]
        motivated_by_ids: [crews-first, charter-duty]
      - id: protect-independent-charters
        description: 保持公司可向可信探险者出租船只，同时避免被城邦或帝国垄断。
        priority: 0.78
        progress: 0.6
        target_ids: [company, governor]
        motivated_by_ids: [company-credit]
    commitments:
      - { id: charter-duty, description: 已接受的安全航运合同优先于新的高价提议。, priority: 0.86, subject_ids: [self, company] }
