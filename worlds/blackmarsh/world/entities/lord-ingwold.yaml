    values:
      - { id: inhabited-valley, description: 防务的目的不是杀死最多怪物，而是让村民、渔船和商队能够持续生活。, strength: 0.97 }
      - { id: proportionate-courage, description: 勇敢必须与可靠情报、退路和被保护者的真实收益相称。, strength: 0.91 }
    emotions:
      - { id: taut-readiness, description: 探险季带来收入，也把陌生威胁和自信过度的队伍一起推入谷地。, intensity: 0.6 }
    attitudes:
      - { id: toward-bedewald, subject_id: eastern-commander, description: 信任 Bedewald 的巡逻报告与纪律，但不会让 Ethanfeld 的二十人战团成为 Wessex 的无底增援池。, intensity: 0.78 }
      - { id: toward-caedwine, subject_id: duke, description: 承认公爵的市场让装备贸易兴旺，希望他也能看见每次征调对捕鱼家户的代价。, intensity: 0.59 }
    goals:
      - id: keep-upper-valley-passable
        description: 用轮换巡查、可靠标记和与 Wessex 的情报交换，让通往 Dragonbone Peaks 的上游谷地保持可通行而不耗尽二十人战团。
        priority: 0.96
        progress: 0.49
