        value: { kind: text, value: claim-credit-if-success-and-deny-authorization-if-exposed }
        description: Elana 很可能在成功后争取政治收益，却会在行动暴露并威胁总部时否认事前授权。
        stance: suspected
        confidence: 0.66
        evidenceIds: [rinisar-cell-readiness]
