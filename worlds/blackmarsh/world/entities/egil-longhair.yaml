  - id: egil-command
    predicate: office
    value: { kind: text, value: chief-of-vasan-raiding-fleet }
    description: Egil 指挥 Vasan 长船远征，并承担航行与返航决策责任。
    access: { kind: public }
meters:
  - { id: "vitality:egil-longhair", definition_id: vitality, current: 25 }
