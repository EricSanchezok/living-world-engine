id: high-chief-cruk
kind: person
name: High Chief Cruk
description: 圣剑 kobold 部族的 High Chief，也是 0413 发光秩序之剑禁触崇拜的仪式领袖。
placement: hex-0413-sword-grove
facts:
  - id: cruk-high-chief-office
    predicate: office
    value: { kind: text, value: high-chief-of-the-sacred-sword-tribe }
    description: Cruk 是圣剑 kobold 部族的 High Chief。
    access: { kind: public }
  - id: cruk-sword-worship
    predicate: ritual-role
    value: { kind: text, value: leads-worship-of-glowing-sword-of-law }
    description: Cruk 主持围绕发光秩序之剑的崇拜和禁触仪式，但守护不等于拥有或能使用圣剑。
    access: { kind: public }
meters:
  - { id: "vitality:high-chief-cruk", definition_id: vitality, current: 15 }
