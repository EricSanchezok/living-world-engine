        priority: 0.97
        progress: 0.68
        target_ids: [blackoak, sinerian, rangers]
        motivated_by_ids: [vengeance, blood-debt]
      - id: keep-column-cohesive
        description: 阻止纵队在接战前分裂为抢掠派、谈判派和逃亡者。
        priority: 0.91
        progress: 0.61
        target_ids: [column]
        motivated_by_ids: [warband-loyalty]
    commitments:
      - { id: blood-debt, description: 向 Harek 的旧部承诺让 Rangers 公开回应他的死亡。, priority: 0.92, subject_ids: [self, column, rangers] }
