    access: { kind: public }
  - id: octa-roundup-recruitment
    predicate: current-policy
    value: { kind: text, value: recruit-roundup-hands-and-guards }
    description: Octa 正为秋季赶牛增募牧工和护卫，以防牲畜在集结途中遭到袭击。
    access: { kind: public }
