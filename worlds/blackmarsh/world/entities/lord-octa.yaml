id: lord-octa
kind: person
name: Lord Octa
description: Wedmor 的 Ostrobard 领主，职责涵盖赶牛、盐肉外运与牧区防务。
placement: hex-1002-wedmor
facts:
  - id: octa-wedmor-office
    predicate: office
    value: { kind: text, value: lord-of-wedmor }
