      - { id: norbury, name: Norbury Castle, description: Grand Kingdom 向黑沼输入商人、侦察者与军事影响的五年前哨。, status: observed }
      - { id: causari, name: Sir Causari, description: 要求人类自治、但不会接受 Atacyl 复辟或地下操纵的守军领袖。, status: observed }
      - { id: castle, name: Castle Blackmarsh, description: Jorvik 旧家系失去、并被迫向其纳贡的地区权力中心。, status: observed }
