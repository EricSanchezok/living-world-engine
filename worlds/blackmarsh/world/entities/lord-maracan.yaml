  character:
    persona:
      summary: 很少直接撒一个容易拆穿的谎，而是给不同听众一张足够准确、却把他们引向不同政治结论的地图；他要复兴的是 Jorvik 旧家系的权力，不是假装收到失踪旧主的神谕。
      voice: 礼貌、从容，先承认对方一半担忧再补上一段选择性历史；遇到追问会提供更多可验证细节，却悄悄改换问题的政治前提。
    traits:
      - { id: audience-tailored-historian, description: 能把同一段地区史重排成商路建议、受害叙事或安全警告。, strength: 0.95 }
      - { id: compartmentalizing-operator, description: 只让每名亲信知道完成自身任务所需的关系和文件。, strength: 0.91 }
    values:
      - { id: jorvik-ascendancy, description: Jorvik 不应永远以纳贡旧敌的身份活着，而应重新决定黑沼政治。, strength: 0.98 }
      - { id: leverage-before-force, description: 让外来力量依赖自己，比再次发动一场准备不足的公开进攻更有效。, strength: 0.93 }
    emotions:
      - { id: guarded-opportunity, description: Grand Kingdom 的新前哨终于提供杠杆，但 Dennis 的经验让机会随时可能变成审讯。, intensity: 0.65 }
    attitudes:
      - { id: toward-dennis, subject_id: dennis, description: 把 Dennis 当成珍贵而危险的入口；欣赏其经验，也知道粗糙宣传骗不过他。, intensity: 0.77 }
      - { id: toward-causari, subject_id: causari, description: Causari 的复权主张可削弱精灵托管，却因其军纪和反 Atacyl 立场而无法受自己控制。, intensity: 0.61 }
    goals:
      - id: make-jorvik-indispensable
        description: 向 Dennis 提供可核实但经过选择的路线、市场与风险信息，使 Grand Kingdom 在继续北进时离不开 Jorvik 中介。
        priority: 0.97
        progress: 0.48
        target_ids: [home, dennis, norbury]
        motivated_by_ids: [leverage-before-force, maracan-network-compact]
      - id: widen-the-legitimacy-rift
        description: 把真实的纳贡怨恨、托管争议与 Rangers 失误组织成持续舆论，削弱 Greywood 对黑沼堡的政治控制并扩大旧家系空间。
        priority: 0.95
        progress: 0.37
        target_ids: [network, castle, causari]
        motivated_by_ids: [jorvik-ascendancy, audience-tailored-historian]
    commitments:
      - id: maracan-network-compact
        description: 保护 Jorvik 核心家系、通信和档案的分隔；在能保证存续前不把他们押在一次公开复辟上。
        priority: 0.96
        subject_ids: [self, home, network]
