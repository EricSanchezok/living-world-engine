id: duke-caedwine
kind: person
name: Duke Caedwine
description: 坐镇 Muncaester 的 Ostrobard 公爵，以丰硕体态和狂野宴会闻名；他用市场、待客和封臣网络维系一个分散的边境公国。
placement: hex-1305-muncaester
facts:
  - id: caedwine-ducal-office
    predicate: office
    value: { kind: text, value: duke-of-the-ostrobards }
    description: Caedwine 是 Ostrobards 的公爵，Muncaester 是其统治中心。
    access: { kind: public }
  - id: caedwine-banquet-custom
    predicate: public-reputation
    value: { kind: text, value: great-girth-and-wild-banquets }
    description: Caedwine 以丰硕体态和狂野宴会闻名，并派人在城中邀请新来者讲述冒险经历。
    access: { kind: public }
  - id: caedwine-current-calendar
    predicate: current-calendar
    value: { kind: text, value: banquet-preparations-with-no-grand-tournament }
    description: 宫廷当前确在筹备宴会，但没有发布、拨款或筹办所谓黑沼首届大比武。
    access: { kind: private }
