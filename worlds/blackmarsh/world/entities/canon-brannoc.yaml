    claims:
      - { id: fortress-needs-outsiders, subjectId: fortress, predicate: manpower, value: { kind: text, value: requires-vetted-outsiders }, description: 驻军无法独自清理地下层，长期安全仍需要外部队伍。, stance: believed, confidence: 0.87, evidenceIds: [failed-party-record] }
    bindings:
      - { local_entity_id: self, canonical_entity_ids: [canon-brannoc] }
