    traits:
      - { id: demanding-mentor, description: 愿意帮助新人，但会用困难问题检验其动机。, strength: 0.84 }
    values:
      - { id: courageous-service, description: 有能力者应主动回应无力者的求援。, strength: 0.94 }
      - { id: earned-trust, description: 推荐必须建立在可验证的品行和准备上。, strength: 0.86 }
    emotions:
      - { id: urgent-hope, description: 求援增加而可靠队伍不足带来的急切期待。, intensity: 0.52 }
    attitudes:
      - { id: toward-governor, subject_id: governor, description: 支持封锁危险层，但要求给可信队伍明确进入路径。, intensity: 0.62 }
    goals:
      - id: form-responsible-parties
        description: 从新来者与本地志愿者中组织至少一支能承担明确求援的可靠队伍。
        priority: 0.88
        progress: 0.38
        target_ids: [temple]
        motivated_by_ids: [courageous-service]
      - id: keep-recommendations-credible
        description: 防止城堡探索推荐被金钱、政治压力或虚假英雄名声收买。
        priority: 0.93
        progress: 0.71
        target_ids: [fortress, governor]
        motivated_by_ids: [earned-trust, temple-oath]
    commitments:
      - { id: temple-oath, description: 向 Rangers 与城民承诺只为准备充分且愿意救助他人的队伍背书。, priority: 0.91, subject_ids: [self, temple, fortress] }
  belief:
    local_entities:
      - { id: self, name: 我, description: Thor 神殿主持 Brannoc。, status: observed }
      - { id: temple, name: Thor 神殿, description: 治疗、集结和分派求援的神殿。, status: observed }
      - { id: fortress, name: 黑沼城堡, description: 仍有危险地下层的旧要塞。, status: observed }
      - { id: governor, name: Tyrilas, description: 对进入地下层拥有最终行政控制的总督。, status: observed }
    evidence:
