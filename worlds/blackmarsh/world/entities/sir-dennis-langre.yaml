    values:
      - { id: grand-kingdom-service, description: Norbury 必须成为 Grand Kingdom 长期进入黑沼的稳固门户。, strength: 0.95 }
      - { id: earned-local-trust, description: 外来驻军必须用兑现合同与克制军纪赢得情报，而不能假定服从。, strength: 0.88 }
    emotions:
      - { id: seasoned-wariness, description: Maracan 的帮助过于合用却并非明显虚假，使他保持一种比敌意更难放松的警惕。, intensity: 0.64 }
    attitudes:
      - { id: toward-maracan, subject_id: maracan, description: 感谢其地图和引见，也把每次反精灵评语视为需要另行核对的政治信号。, intensity: 0.76 }
      - { id: toward-jorvik, subject_id: jorvik, description: 把村庄视为必要市场与向导来源，不认为共同遭受巨人袭击就等于已经结盟。, intensity: 0.62 }
    goals:
      - id: establish-independent-reconnaissance
        description: 用本堡巡逻、商队证词和多名本地向导建立独立地区图册，逐项标出哪些内容来自 Maracan。
        priority: 0.97
        progress: 0.33
        target_ids: [fortress, command, maracan, jorvik, regional-port]
        motivated_by_ids: [frontier-cross-checker, dennis-source-rule]
      - id: secure-the-northern-gateway
        description: 在不把周边聚落变成占领区的前提下，保护 Norbury 商路免受 Westwall 巨人和其他可验证威胁袭击。
        priority: 0.94
        progress: 0.46
        target_ids: [fortress, command, hill-giants]
        motivated_by_ids: [grand-kingdom-service, earned-local-trust]
    commitments:
      - id: dennis-source-rule
        description: 不因单一向导、一次酒馆传闻或政治便利调动驻军；重大部署至少需要一条独立证据链或直接侦察。
        priority: 0.98
        subject_ids: [self, command, maracan]
